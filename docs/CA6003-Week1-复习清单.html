function format(text){const span=document.createElement('span');span.textContent=text;return span.innerHTML.replace(/`([^`]+)`/g,'<code>$1</code>');}
function showStorageStatus(){document.getElementById('save').textContent=storageWorks?'进度自动保存在当前浏览器':'浏览器暂不支持保存；本次页面内仍可勾选';}
function save(){const state={completed:[...completed],notes:notes.value};cache[activeWeek]=state;try{localStorage.setItem(weeks[activeWeek].storageKey,JSON.stringify(state));storageWorks=true;}catch{storageWorks=false;}showStorageStatus();}
function nextItem(){return items.find(i=>!completed.has(i.id));}
function update(){const done=items.filter(i=>completed.has(i.id)).length;document.getElementById('count').textContent=`${weeks[activeWeek].label} · ${done} / ${items.length} 已完成`;const progress=document.getElementById('progress');progress.max=items.length;progress.value=done;const next=nextItem();document.getElementById('current').textContent=next?`接下来 · ${next.title}`:`${weeks[activeWeek].label}已完成，准备重做错题`;document.getElementById('continue').disabled=!next;items.forEach(item=>{const row=document.getElementById(item.id);row.classList.toggle('done',completed.has(item.id));row.classList.toggle('current-row',item===next);row.querySelector('.tag').textContent=item===next?'当前':'';});groups.forEach((g,gi)=>document.querySelector(`#section-${gi} .group-count`).textContent=`${items.filter(i=>i.gi===gi&&completed.has(i.id)).length} / ${g.items.length}`);}
function renderWeek(id){activeWeek=id;activeCourse=id.startsWith('ca6001-')?'ca6001':'ca6003';lastWeek[activeCourse]=id;courseButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.course===activeCourse)));document.getElementById('course-title').textContent=`${activeCourse.toUpperCase()} 复习清单`;tabs.forEach((tab,index)=>{tab.dataset.week=courseWeeks[activeCourse][index];tab.textContent=courseLabels[activeCourse][index];});groups=weeks[id].groups;items=groups.flatMap((group,gi)=>group.items.map((item,ii)=>({...item,id:`g${gi}-i${ii}`,gi})));let stored=cache[id];if(!stored){try{stored=JSON.parse(localStorage.getItem(weeks[id].storageKey)||'{}')||{};}catch{stored={};storageWorks=false;}}completed=new Set(Array.isArray(stored.completed)?stored.completed:items.filter(i=>i.done).map(i=>i.id));notes.value=typeof stored.notes==='string'?stored.notes:'';container.replaceChildren();
groups.forEach((group,gi)=>{const section=document.createElement('details');section.id=`section-${gi}`;section.open=true;section.innerHTML=`<summary><span class="number">${String(gi+1).padStart(2,'0')}</span><span>${format(group.title.replace(/^\d+\.\s*/,''))}</span><span class="group-count"></span><svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary><div class="items"></div>`;const list=section.querySelector('.items');items.filter(i=>i.gi===gi).forEach(item=>{const label=document.createElement('label');label.className='row';label.id=item.id;label.innerHTML=`<input type="checkbox"><div class="text"><div class="title">${format(item.title)}<span class="tag"></span></div><div class="lesson"><p><span class="lesson-label">理解</span>${format(item.explanation)}</p><p><span class="lesson-label">例子</span>${format(item.example)}</p><p class="exam"><span class="lesson-label">做题判断</span>${format(item.exam)}</p></div></div>`;const input=label.querySelector('input');input.checked=completed.has(item.id);input.addEventListener('change',()=>{input.checked?completed.add(item.id):completed.delete(item.id);save();update();});list.append(label);if(item.detailsHTML){const examples=document.createElement("div");examples.className="worked-examples";examples.innerHTML=item.detailsHTML;list.append(examples);}});container.append(section);});

tabs.forEach(tab=>{const selected=tab.dataset.week===id;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;});document.getElementById('week-panel').setAttribute('aria-labelledby',tabs.find(tab=>tab.dataset.week===id).id);document.getElementById('week-subtitle').textContent=`${weeks[id].subtitle} · 一次学一块，掌握后打勾。`;update();showStorageStatus();}
function switchWeek(id){if(id===activeWeek)return;save();renderWeek(id);}
tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>switchWeek(tab.dataset.week));tab.addEventListener('keydown',event=>{let target;if(event.key==='ArrowRight')target=tabs[(index+1)%tabs.length];else if(event.key==='ArrowLeft')target=tabs[(index-1+tabs.length)%tabs.length];else if(event.key==='Home')target=tabs[0];else if(event.key==='End')target=tabs[tabs.length-1];if(target){event.preventDefault();switchWeek(target.dataset.week);target.focus();}});});
courseButtons.forEach(button=>button.addEventListener('click',()=>{if(button.dataset.course===activeCourse)return;save();renderWeek(lastWeek[button.dataset.course]);}));
notes.addEventListener('input',save);
document.getElementById('continue').addEventListener('click',()=>{const next=nextItem();if(!next)return;document.getElementById(`section-${next.gi}`).open=true;document.getElementById(next.id).scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.querySelector(`#${next.id} input`).focus({preventScroll:true});});
document.getElementById('expand').addEventListener('click',()=>container.querySelectorAll('details').forEach(d=>d.open=true));
document.getElementById('collapse').addEventListener('click',()=>container.querySelectorAll('details').forEach(d=>d.open=false));
renderWeek('week1');
</script></body></html>
