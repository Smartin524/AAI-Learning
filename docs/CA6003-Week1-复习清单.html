<section class="notes"><h2>我的易错点</h2><p>只记混淆的地方：原来怎么想？正确条件是什么？</p><textarea id="notes" aria-label="我的易错点" placeholder="例如：EDA 可以辅助特征选择，但自动特征选择不是它的主要目标。"></textarea></section>
<footer>勾选标准：能用自己的话解释，并能说明选项为什么对或错。进度保存在本机当前浏览器，不会自动同步到聊天。</footer>
</div></main><script>
const weeks={"week1": {"label": "第一周", "subtitle": "Data Profiling and Cleaning", "storageKey": "aai-ca6003-week1-checklist-v1", "groups": [{"title": "1. 数据科学思考流程", "items": [{"title": "Ask：明确问题和决策目标", "desc": "能区分提出问题、收集数据和处理数据。", "done": true, "explanation": "Ask 是分析的起点：先明确业务问题、衡量指标、分析范围和希望支持的决策。把“生意不好”改写成可以用数据检验的问题，避免拿到数据就直接建模。", "example": "网店销售下降：问下降发生在哪个月、下降的是销售额还是订单量、哪类商品变化最大，以及分析要帮助决定调整价格还是营销。", "exam": "明确问题、指标或决策目标属于 Ask；收集记录和删除重复行不属于 Ask。"}, {"title": "Prepare：准备数据", "desc": "确定需要什么数据、从哪里获取、来源是否可信。", "done": false, "explanation": "Prepare 是确定并获取需要的数据，同时检查来源、采集方式、覆盖范围和可信度。先判断这些数据能不能回答问题，再进入具体清洗。", "example": "研究主场与客场表现：收集比赛地点、比分、日期、对手实力；确认不同赛季的数据定义一致，记录来自可靠系统。", "exam": "确定需要哪些字段、获取数据、检查来源属于 Prepare；用中位数填补缺失值属于 Process。"}, {"title": "Process：处理数据", "desc": "识别缺失、错误、重复和格式不一致，并选择处理方法。", "done": false, "explanation": "Process 把原始数据整理成可以分析的数据，包括处理缺失、重复、无效值、类型和单位不一致。处理方式要有依据，不能为了整齐随意改数据。", "example": "年龄出现 −5，需要核对或标记无效；“Singapore”和“singapore”统一类别写法；重复导入的同一订单需要去重。", "exam": "实际修正、清洗或整理数据属于 Process。发现问题后，不一定必须删除，也可以核查、修正或保留并标记。"}, {"title": "Analyze：分析数据", "desc": "从数据中寻找证据，回答最初的问题。", "done": false, "explanation": "Analyze 使用统计、比较和可视化寻找证据，回答 Ask 阶段提出的问题。既要看到规律，也要考虑样本量、其他变量和解释限制。", "example": "比较主客场平均得分，或者画出每 10 分钟的冲刺次数，检查比赛后段是否出现下降。", "exam": "计算、比较、探索关系属于 Analyze；看到两个变量一起变化，不能直接断言其中一个导致另一个。"}, {"title": "Share：交流结果", "desc": "清楚展示发现，让决策者理解证据。", "done": false, "explanation": "Share 将分析发现清楚地传达给需要做决定的人。说明问题、关键证据、结论和限制，选择容易理解的图表，而不是展示所有原始记录。", "example": "向教练展示“70 分钟后冲刺次数下降”的图，并说明这是多场比赛的总体趋势，还需要考虑对手和比赛节奏。", "exam": "制作报告、展示图表和解释发现属于 Share；真正改变训练计划属于 Act。"}, {"title": "Act：采取行动", "desc": "根据证据调整业务行动，并检查结果。", "done": false, "explanation": "Act 是将证据转成行动，并观察行动之后的结果。行动应当与分析目标对应，不能只形成报告而没有后续决策。", "example": "根据比赛后段体能下降的证据，调整体能训练或换人时间，再监测后续比赛的数据。", "exam": "调整策略、执行方案、跟踪实施效果属于 Act。分析证据支持行动，但不保证行动一定成功。"}, {"title": "流程综合辨析", "desc": "能给网店或足球队案例中的操作匹配正确阶段。", "done": false, "explanation": "记住六阶段顺序：Ask → Prepare → Process → Analyze → Share → Act。判断阶段时看题目正在做的操作；现实中可能反复回到前面的阶段。", "example": "问“哪类商品销量下降”是 Ask；下载订单是 Prepare；删除重复订单是 Process；比较销量是 Analyze；汇报是 Share；调整推广是 Act。", "exam": "不要只看“数据”这个词就选 Prepare。关键是明确、收集、清洗、分析、交流还是行动。"}]}, {"title": "2. 数据类型", "items": [{"title": "结构化与非结构化数据", "desc": "能区分表格数据与文本、图像、视频、音频。", "done": false, "explanation": "结构化数据有明确字段或组织规则，典型形式是每行一条记录、每列一个字段。非结构化数据没有直接可用于表格分析的固定字段表示，例如自然语言文本、图像和音频。", "example": "客户表中的 ID、年龄、收入是结构化字段；客户评价文本和上传的照片是非结构化内容，通常需要进一步提取特征。", "exam": "“能存进数据库”不等于内容本身是结构化数据；表格中的一列也可以存放非结构化文本。"}, {"title": "数值与类别数据", "desc": "能区分数值、无序类别和有序类别。", "done": false, "explanation": "数值数据表示可计算的数量；类别数据表示所属类别。类别又分 nominal（无自然顺序）与 ordinal（有自然顺序），不能把任意编号都当作有意义的数量。", "example": "年龄、收入是数值；颜色是无序类别；Small、Medium、Large 是有序类别；客户 ID 即使由数字组成，通常也是标识。", "exam": "看到数字不一定是数值特征。类别有顺序，也不代表相邻类别之间的差距相等。"}, {"title": "时间序列数据", "desc": "理解时间顺序、趋势和季节性的重要性。", "done": false, "explanation": "时间序列按时间记录同一个指标，观察之间可能存在时间依赖。分析时关注趋势、季节性和异常变化，并检查时间间隔是否一致、有无缺失时点。", "example": "每日网站访问量可能周末较高；按日期绘图才能看到这种周期。打乱日期后，时间变化的信息会丢失。", "exam": "时间顺序不能随意忽略。课件以固定间隔序列为典型例子，但实际记录也可能不规则，需要先检查。"}, {"title": "网络数据", "desc": "能指出 node（节点）、edge（边）及其属性。", "done": false, "explanation": "网络数据由 nodes（节点）和 edges（边）描述实体及其关系，节点和边还可以附带属性。它有明确的组织规则，不只是普通的独立记录集合。", "example": "MRT 站点是节点，连接站点的线路段是边；站点可以有名称，线路段可以有距离。社交网络中用户是节点，好友关系是边。", "exam": "题目问 node 就找实体，问 edge 就找关系；不要把节点属性误当成连接关系。"}, {"title": "非结构化数据的挑战", "desc": "理解高维度，以及文本、视频、音频中的上下文或时间依赖。", "done": false, "explanation": "文本有大量词汇和上下文，图像有大量像素，视频同时包含空间和时间信息，音频也随时间变化。高维度和依赖关系会增加存储、计算和建模难度。", "example": "一张 100 × 100 的 RGB 图像有 30,000 个通道数值；视频还增加帧数。文本中的“它”需要上下文才能确定指代。", "exam": "图像不是一个单独数值；视频也不只是互不相关的图片。模型或特征处理应考虑数据的结构与依赖。"}]}, {"title": "3. EDA 与 Data Profiling", "items": [{"title": "EDA 的目的", "desc": "理解分布、模式和关系，检查数据质量与假设；区分这些目标与模型优化。", "done": false, "explanation": "EDA 是 Exploratory Data Analysis：通过汇总统计和可视化理解分布、模式与变量关系，发现质量问题，并检查初步假设是否合理。它为后续分析和建模提供依据。", "example": "画年龄直方图看分布，用散点图看年龄与浏览量的关系，检查缺失比例和明显不合理的数值。", "exam": "理解数据、检查质量与假设是核心目标；最大化模型准确率、自动特征选择和降维不是 EDA 的主要目标。"}, {"title": "Profiling 与 Cleaning 的区别", "desc": "前者发现问题，后者处理问题。", "done": false, "explanation": "Data Profiling 系统检查数据的结构、内容和关系，告诉你数据是什么样、有何问题；Data Cleaning 根据发现处理错误和不一致。两者可以迭代进行。", "example": "Profiling 发现年龄最小值为 −5；Cleaning 核对来源并修正，或把无法确认的值标记为缺失。", "exam": "“检查或发现”与“处理或修正”要分清；发现异常不等于已经完成清洗。"}, {"title": "Structure discovery：结构发现", "desc": "检查字段类型、数据格式和唯一性；知道重名不一定是重复记录。", "done": false, "explanation": "Structure discovery 关注字段类型、格式、数据组织和唯一性，例如年龄是否存成字符串、ID 是否唯一、日期格式是否一致。它帮助判断表的结构是否符合预期。", "example": "客户表有 5 行、ID 有 5 个不同值，支持 ID 在当前表内唯一；Name 只有 4 个不同值，可能只是两个人同名。", "exam": "唯一值数可以发现潜在问题，但不能仅凭名字重复就认定两条记录重复。"}, {"title": "Content discovery：内容发现", "desc": "检查缺失值、取值范围、分布和无效数值。", "done": false, "explanation": "Content discovery 检查字段实际包含的值：缺失比例、最小最大值、分布、异常范围，以及类别是否合理。要结合业务规则判断数据是否有效。", "example": "Age 最小值为 −5，明显不合理；Revenue 最大值很高，则可能是真实大额订单，需要进一步检查。", "exam": "数值极端与数值无效是两回事。范围检查能提示问题，但不能独立证明所有异常都是错误。"}, {"title": "Relationship discovery：关系发现", "desc": "检查变量之间的关联；知道相关不等于因果。", "done": false, "explanation": "Relationship discovery 检查变量之间的关联或一致性，例如相关系数、交叉表以及业务规则。它帮助找出变量如何一起变化，或记录之间是否矛盾。", "example": "Age 与 Product_Views 的相关系数为 −0.90，表示强负线性相关；订单总额与明细求和不一致，提示需要核查。", "exam": "相关系数的符号表示方向，绝对值表示线性关联强度；相关不等于因果，零相关也不保证没有非线性关系。"}, {"title": "常见 pandas 操作", "desc": "理解 `info()`、`describe()`、`isnull().sum()`、`nunique()`、`min()`、`max()` 和 `corr()` 的用途。", "done": false, "explanation": "`info()` 看类型与非缺失数量；`describe()` 看汇总统计；`isnull().sum()` 统计每列缺失数；`nunique()` 统计不同值数量；`min()`、`max()` 看极值；`corr()` 检查数值列关联。", "example": "检查年龄用 `min()`、`max()`；检查缺失用 `isnull().sum()`；检查客户 ID 的不同值数量用 `nunique()`。", "exam": "`count()` 通常统计非缺失值，不是不同值数量；`nunique()` 不是直接计算重复记录的数量。", "detailsHTML": "<div class=\"worked-intro\"><h3>用同一张小表，逐个看输出<\/h3><p>每行是一位客户。NaN / None 表示缺失；−5 是故意加入的无效年龄，用来练习发现问题。<\/p><\/div>\n<div class=\"table-scroll\"><table><caption>示例数据 df<\/caption><thead><tr><th>ID<\/th><th>Name<\/th><th>Age<\/th><th>Product_Views<\/th><\/tr><\/thead><tbody><tr><td>101<\/td><td>Amy<\/td><td>20<\/td><td>100<\/td><\/tr><tr><td>102<\/td><td>Ben<\/td><td>30<\/td><td>80<\/td><\/tr><tr><td>103<\/td><td>Amy<\/td><td>NaN<\/td><td>70<\/td><\/tr><tr><td>104<\/td><td>Dan<\/td><td>−5<\/td><td>150<\/td><\/tr><tr><td>105<\/td><td>None<\/td><td>30<\/td><td>80<\/td><\/tr><\/tbody><\/table><\/div>\n<details class=\"code-setup\"><summary>想在 Python 中试一下？展开查看建表代码<\/summary><pre><code>import pandas as pd\n\ndf = pd.DataFrame({\n    \"ID\": [101, 102, 103, 104, 105],\n    \"Name\": [\"Amy\", \"Ben\", \"Amy\", \"Dan\", None],\n    \"Age\": [20, 30, None, -5, 30],\n    \"Product_Views\": [100, 80, 70, 150, 80]\n})<\/code><\/pre><\/details>\n<section class=\"worked-step\"><h4>① info()：表的结构，有多少值没缺失？<\/h4><pre><code>df.info()<\/code><\/pre><pre class=\"output\"><code>共 5 行、4 列（关键输出）\nID             5 non-null    int64\nName           4 non-null    object\nAge            4 non-null    float64\nProduct_Views  5 non-null    int64<\/code><\/pre><p>Name 和 Age 都只有 4 个非缺失值，所以各缺 1 个。Age 在这张表里因含缺失值而显示为 float64。<strong>−5 虽然不合理，仍然是非缺失值，会被计入。<\/strong><\/p><p class=\"exam-note\">info() 提供类型与完整性线索，不会自动判断年龄是否合理。不同 pandas 版本的文本类型或显示格式可能不同。<\/p><\/section>\n<section class=\"worked-step\"><h4>② describe()：数值分布是什么样？<\/h4><pre><code>df[\"Age\"].describe()<\/code><\/pre><pre class=\"output\"><code>count     4.00000\nmean     18.75000\nstd      16.52019\nmin      -5.00000\n25%      13.75000\n50%      25.00000\n75%      30.00000\nmax      30.00000<\/code><\/pre><p>计算使用 20、30、−5、30，忽略 NaN。均值 = (20 + 30 − 5 + 30) ÷ 4 = <strong>18.75<\/strong>；中位数（50%）= (20 + 30) ÷ 2 = <strong>25<\/strong>。最小值 −5 提示存在无效年龄。<\/p><p class=\"exam-note\">describe() 是汇总统计，不会删除 −5。默认 df.describe() 主要汇总数值列；检查全部类型可用 df.describe(include=\"all\")。<\/p><\/section>\n<section class=\"worked-step\"><h4>③ isnull().sum()：每一列缺几个？<\/h4><pre><code>df.isnull().sum()<\/code><\/pre><pre class=\"output\"><code>ID               0\nName             1\nAge              1\nProduct_Views    0<\/code><\/pre><p>isnull() 先把每格变成 True（缺失）或 False（非缺失）；sum() 默认按列相加，True 当作 1，所以得到每列缺失数量。<\/p><p class=\"exam-note\">Age 的 −5 不算缺失。因此 Age 缺失数是 1，不是 2。空字符串也通常不会自动算成缺失。<\/p><\/section>\n<section class=\"worked-step\"><h4>④ count() 与 nunique()：数的是“条数”还是“不同值”？<\/h4><pre><code>df[\"Name\"].count()    # 4\ndf[\"Name\"].nunique()  # 3<\/code><\/pre><p>非缺失姓名有 Amy、Ben、Amy、Dan，共 <strong>4 条<\/strong>；不同姓名只有 Amy、Ben、Dan，共 <strong>3 种<\/strong>。两个函数默认都不把缺失值当作普通值计入。<\/p><div class=\"table-scroll\"><table><thead><tr><th>操作<\/th><th>输出<\/th><th>为什么<\/th><\/tr><\/thead><tbody><tr><td>len(df)<\/td><td>5<\/td><td>一共有 5 行，包括含缺失的行<\/td><\/tr><tr><td>df[\"Age\"].count()<\/td><td>4<\/td><td>20、30、−5、30，共 4 个非缺失值<\/td><\/tr><tr><td>df[\"Age\"].nunique()<\/td><td>3<\/td><td>不同年龄是 20、30、−5<\/td><\/tr><tr><td>df[\"ID\"].nunique()<\/td><td>5<\/td><td>5 个 ID 都不同<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exam-note\">Amy 出现两次，但 ID 分别为 101 和 103，不能只凭同名认定客户记录重复。nunique() 计算不同值数量，不是重复行数。<\/p><\/section>\n<section class=\"worked-step\"><h4>⑤ min() / max()：范围合理吗？<\/h4><pre><code>df[\"Age\"].min()  # -5.0\ndf[\"Age\"].max()  # 30.0<\/code><\/pre><p>默认忽略缺失值。−5 小于合理年龄下限，需要核对或标记无效；最大年龄 30 本身没有明显问题。<\/p><p class=\"exam-note\">找到最小或最大值只是检查的一步。极端值是否错误，要看业务含义；不能把“最大值”直接等同于“异常值”。<\/p><\/section>\n<section class=\"worked-step\"><h4>⑥ corr()：变量是否一起变化？<\/h4><pre><code>df[[\"Age\", \"Product_Views\"]].corr()<\/code><\/pre><pre class=\"output\"><code>               Age  Product_Views\nAge            1.0           -1.0\nProduct_Views -1.0            1.0<\/code><\/pre><p>默认计算 Pearson 线性相关。对角线是变量与自己的相关（本例为 1）；交叉位置是两列之间的相关（本例为 −1）。Age 缺失的那一行不参与这对变量的计算。<\/p><p>本例参与计算的四行恰好满足 Product_Views = 140 − 2 × Age，所以得到完全负线性相关。<strong>这只演示函数输出：数据里还有无效年龄 −5，应该先核查，不能据此直接形成业务结论。<\/strong><\/p><p class=\"exam-note\">corr() 不会自动清理无效值。相关不等于因果；小样本也不能代表总体规律。<\/p><\/section>\n<section class=\"worked-step practice\"><h4>合上解释，手写检查<\/h4><p>1. Name 有 5 行，为什么 count() 是 4？<br>2. 为什么 Name 的 nunique() 是 3？<br>3. Age = −5 会被 isnull() 标为 True 吗？<br>4. 想找不合理的最小年龄，用哪个函数？<br>5. corr() 得到 −1，能证明年龄导致浏览量下降吗？<\/p><details class=\"answer\"><summary>写完再展开答案<\/summary><p>1. 有一个 None，count() 忽略缺失。<br>2. Amy 重复出现，不同姓名只有三种。<br>3. 不会；−5 是无效值，但不是缺失值。<br>4. df[\"Age\"].min()。<br>5. 不能；相关不等于因果，且这里有数据质量与样本量限制。<\/p><\/details><\/section>"}]}, {"title": "4. Data Cleaning", "items": [{"title": "识别数据质量问题", "desc": "能找出缺失、重复、无效值和格式不一致。", "done": false, "explanation": "常见问题包括 missing values、duplicates、invalid values 和 inconsistent formats。先识别问题类型，再选择处理策略，避免对所有问题使用同一种操作。", "example": "年龄为空是缺失；同一订单被重复导入是重复；年龄 −5 是无效值；体重混用 kg 和 lb 是单位不一致。", "exam": "发现问题后要考虑业务语义。不同订单内容相同未必重复，极端收入也未必无效。"}, {"title": "缺失不等于零", "desc": "能解释为什么 GPS 缺失不代表球员没有跑动。", "done": false, "explanation": "缺失表示没有得到可靠观测，零表示实际数值为 0。把缺失随意填成零，会改变均值、分布及变量关系，甚至让模型学到错误规律。", "example": "GPS 设备失联导致跑动距离缺失，不代表球员站着没动；订单金额未知，也不代表免费订单。", "exam": "只有业务语义确实支持时才考虑填零。“缺失值都能填零”是错误说法。"}, {"title": "删除缺失数据", "desc": "能说明什么时候可以考虑删除，以及数据损失和偏差风险。", "done": false, "explanation": "可以考虑删除缺失较少的记录，或删除缺失非常严重且价值有限的字段，但要检查丢失多少数据、是否集中在某些群体，以及会不会改变样本代表性。", "example": "1,000 条记录中 3 条随机缺少非关键字段，与某一年龄群体大面积缺失，删除的影响完全不同。", "exam": "缺失比例小不保证删除绝对安全；大量删除可能减少样本并引入偏差，不能把删除当成默认最佳方法。"}, {"title": "Mean / Median / Mode 填补", "desc": "能根据数值分布、异常值和类别数据选择方法。", "done": false, "explanation": "Mean 是平均值，适用于数值数据且容易受极端值影响；Median 是中位数，通常更适合偏态或含极端值的数值；Mode 是众数，可用于类别数据。填补会改变分布，不能恢复真实观测。", "example": "收入为 2、3、4、100：mean = 27.25，median = 3.5。极端收入把均值拉高，因此中位数往往更能代表主体。", "exam": "不能给颜色计算有意义的平均值；中位数更稳健，但并不是所有缺失问题的最佳答案。"}, {"title": "重复记录判断", "desc": "根据记录含义和关键字段判断，避免仅凭同名删除。", "done": false, "explanation": "重复记录应依据记录的单位和业务主键判断。要弄清一行代表一个客户、一笔订单还是一次活动，再决定哪些字段足以识别同一记录。", "example": "两个客户都叫 John Doe，不一定重复；同一个 Order_ID 的同一版本订单被导入两次，更可能是真正重复。", "exam": "字段相同不一定是重复事件；只按姓名去重可能误删不同的人。"}, {"title": "无效值与格式修正", "desc": "能处理负年龄、单位不同、类别拼写不一致等问题。", "done": false, "explanation": "无效值违反数据含义或业务规则，格式不一致则可能使相同信息被误认为不同类别。处理前应核查来源，统一单位和格式，并记录无法确认的情况。", "example": "把“Male”和“male”统一；将 lb 换算成 kg；负年龄不能简单取绝对值，应先核对或标记缺失。", "exam": "修正需要依据。不能随便把异常数值替换成“看起来合理”的数字，也不能直接混合不同单位计算。"}, {"title": "防止数据泄漏", "desc": "先划分训练与测试数据，再用训练集计算填补值；验证和测试使用相同规则。", "done": false, "explanation": "先划分 train、validation、test，再仅在训练集上计算填补统计量。验证和测试集使用训练阶段得到的同一个值，模拟面对尚未见过的新数据。", "example": "训练年龄为 20、30、40，mean = 30；测试集中缺失年龄也填 30，不能将测试集的 100 加入均值计算。", "exam": "用全体数据先算均值再 split 会泄漏测试信息。交叉验证时，每个训练折也要单独 fit 预处理。", "detailsHTML": "<div class=\"worked-intro\"><h3>为什么必须先划分，再计算填补值？<\/h3><p><strong>数据泄漏（data leakage）：训练过程提前用到了本应留到验证或测试阶段才知道的信息。<\/strong>此时评估不能可靠反映模型面对新数据的表现；泄漏可能使成绩虚高，但并不意味着每一次泄漏都一定提高成绩。<\/p><\/div>\n<section class=\"worked-step\"><h4>① 先分清三份数据的用途<\/h4><div class=\"table-scroll\"><table><thead><tr><th>数据集<\/th><th>作用<\/th><th>预处理怎么做<\/th><\/tr><\/thead><tbody><tr><td>Train · 训练集<\/td><td>学习模型参数<\/td><td>学习填补、标准化等规则，再应用规则<\/td><\/tr><tr><td>Validation · 验证集<\/td><td>比较方案、调整超参数<\/td><td>应用当前训练集学到的规则<\/td><\/tr><tr><td>Test · 测试集<\/td><td>最后评估未见数据上的表现<\/td><td>应用训练阶段确定的规则<\/td><\/tr><\/tbody><\/table><\/div><p>测试集模拟未来的新客户，不能提前让这些客户的数据参与当前训练规则的学习。验证集可以帮助选择方案，但当前方案的填补均值仍由训练集计算。<\/p><\/section>\n<section class=\"worked-step\"><h4>② 正确做法：只用训练集算均值<\/h4><div class=\"table-scroll\"><table><thead><tr><th>数据集<\/th><th>原始年龄<\/th><th>填补后<\/th><\/tr><\/thead><tbody><tr><td>训练集<\/td><td>20、30、40、缺失<\/td><td>20、30、40、<strong>30<\/strong><\/td><\/tr><tr><td>测试集<\/td><td>100、缺失<\/td><td>100、<strong>30<\/strong><\/td><\/tr><\/tbody><\/table><\/div><pre><code>训练均值 = (20 + 30 + 40) ÷ 3 = 30<\/code><\/pre><p>训练集缺失的位置填 30，测试集缺失的位置也填 30。<strong>测试集原本已知的 100 保留，不会变成 30。<\/strong>填补只处理缺失位置。<\/p><p class=\"exam-note\">这个例子只演示规则来源；实际选择 mean、median 或其他方法，还要看分布与缺失原因。<\/p><\/section>\n<section class=\"worked-step\"><h4>③ 错误做法：先用全部数据算均值，再划分<\/h4><pre><code>全体均值 = (20 + 30 + 40 + 100) ÷ 4 = 47.5<\/code><\/pre><p>如果把训练集的缺失年龄填成 47.5，测试集中的 100 就已经影响了训练数据。即使之后才划分数据，这种影响也不会自动消失。<\/p><p class=\"exam-note\"><strong>不使用测试标签，也可能泄漏。<\/strong>测试特征参与了均值、标准差或其他需要学习的预处理规则，同样会影响训练流程。<\/p><\/section>\n<section class=\"worked-step\"><h4>④ fit 与 transform：学习规则，应用规则<\/h4><p><strong>fit<\/strong> 从训练数据学习规则，例如算出均值 30。<strong>transform<\/strong> 使用已经学到的规则，例如将缺失处填成 30，不重新计算均值。<\/p><pre><code>先划分数据\n    ↓\n训练集：fit → 学到均值 30 → transform\n验证集：使用均值 30 → transform\n测试集：使用均值 30 → transform<\/code><\/pre><p>不能用测试集的 100 单独算均值，再把测试缺失值填成 100。我们要评估的是训练阶段确定的规则和模型，而不是临时为测试数据重新学习规则。<\/p><details class=\"code-setup\"><summary>代码对照：哪些地方能 fit？<\/summary><pre><code>from sklearn.impute import SimpleImputer\n\nimputer = SimpleImputer(strategy=\"mean\")\n\n# 学习训练均值，然后应用到训练数据\nX_train_filled = imputer.fit_transform(X_train)\n\n# 使用已经学到的均值，不重新 fit\nX_val_filled = imputer.transform(X_val)\nX_test_filled = imputer.transform(X_test)\n\n# 错误示例：不要在测试集重新学习规则\n# X_test_filled = imputer.fit_transform(X_test)<\/code><\/pre><\/details><\/section>\n<section class=\"worked-step\"><h4>StandardScaler：先看懂公式中的每一个符号<\/h4><pre><code>z = (x − μ_train) / σ_train<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>符号<\/th><th>读法／含义<\/th><th>从哪里来？<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>当前这个样本某个特征的原始数值<\/td><td>可以来自训练、验证或测试。例如当前客户年龄 40。<\/td><\/tr><tr><td>μ_train<\/td><td>mu：该特征在训练集中的平均值<\/td><td>只用训练集这一列计算，不是所有列混在一起算。<\/td><\/tr><tr><td>σ_train<\/td><td>sigma：该特征在训练集中的标准差<\/td><td>衡量该列数值围绕均值的波动程度，由训练数据计算。<\/td><\/tr><tr><td>train<\/td><td>下标，表示统计量来自训练集<\/td><td>不是参与乘法的参数，也不是当前 x 必须来自训练集。<\/td><\/tr><tr><td>z<\/td><td>转换后的标准化数值，没有单位<\/td><td>表示 x 高于或低于训练均值多少个训练标准差。<\/td><\/tr><\/tbody><\/table><\/div><p><strong>先减均值：<\/strong>确定离中心多远；<strong>再除标准差：<\/strong>将距离换成“几个标准差”。正号表示高于均值，负号表示低于均值，0 表示等于均值。<\/p><\/section>\n<section class=\"worked-step\"><h4>完整例子：从原始年龄算出均值、标准差，再转换<\/h4><p>训练集年龄为 <strong>20、20、40、40<\/strong>。下面使用 StandardScaler 默认的总体标准差约定，分母是 n，不是 n−1。<\/p><pre><code>① 训练均值 μ = (20 + 20 + 40 + 40) / 4 = 30\n② 每个值减均值：−10、−10、10、10\n③ 差距平方：100、100、100、100\n④ 平方差的均值（方差）：400 / 4 = 100\n⑤ 标准差 σ = √100 = 10\n⑥ 标准化：z = (x − 30) / 10<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>原始年龄 x<\/th><th>代入公式<\/th><th>结果 z<\/th><th>怎么理解<\/th><\/tr><\/thead><tbody><tr><td>20（训练）<\/td><td>(20 − 30) / 10<\/td><td>−1<\/td><td>低于训练均值 1 个标准差<\/td><\/tr><tr><td>40（训练）<\/td><td>(40 − 30) / 10<\/td><td>1<\/td><td>高于训练均值 1 个标准差<\/td><\/tr><tr><td>30（新客户）<\/td><td>(30 − 30) / 10<\/td><td>0<\/td><td>恰好等于训练均值<\/td><\/tr><tr><td>50（测试）<\/td><td>(50 − 30) / 10<\/td><td>2<\/td><td>高于训练均值 2 个标准差<\/td><\/tr><tr><td>10（测试）<\/td><td>(10 − 30) / 10<\/td><td>−2<\/td><td>低于训练均值 2 个标准差<\/td><\/tr><\/tbody><\/table><\/div><p>训练集转换成 −1、−1、1、1，均值为 0、总体标准差为 1。测试值即使更大或更小，也继续使用 μ = 30、σ = 10。<strong>标准化不限制数值只能在 −1～1 或 0～1。<\/strong><\/p><p class=\"exam-note\">σ 是分散程度，不是所有点与均值的平均绝对距离。本例差距恰好都为 10，但一般数据需要按平方差再开根号计算。<\/p><\/section>\n<section class=\"worked-step\"><h4>每一列分别计算，不把年龄和收入混起来<\/h4><p>如果有 Age 和 Income 两列，fit 会学习两套统计量。假设年龄的 μ = 30、σ = 10，收入的 μ = 5,000、σ = 1,000，则客户 [40, 7,000] 转换成 [1, 2]。<\/p><pre><code>Age：   (40 − 30) / 10 = 1\nIncome：(7000 − 5000) / 1000 = 2<\/code><\/pre><p>两个特征各自用自己的尺子标准化；转换后容易比较“偏离本列中心的程度”，但不能由此断言收入比年龄重要两倍。<\/p><\/section>\n<section class=\"worked-step\"><h4>代码里的每个名字是什么意思？<\/h4><pre><code>from sklearn.preprocessing import StandardScaler\n\nscaler = StandardScaler()\nscaler.fit(X_train)\n\nX_train_scaled = scaler.transform(X_train)\nX_val_scaled = scaler.transform(X_val)\nX_test_scaled = scaler.transform(X_test)<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>名字／操作<\/th><th>意思<\/th><\/tr><\/thead><tbody><tr><td>scaler<\/td><td>保存标准化规则的对象；fit 后保存每列均值、方差和缩放因子。<\/td><\/tr><tr><td>X_train / X_val / X_test<\/td><td>训练／验证／测试的输入特征表。大写 X 常表示多行多列；目标答案一般记作 y。<\/td><\/tr><tr><td>fit(X_train)<\/td><td>从训练特征学习 μ、σ，不是直接训练预测模型，也不会就地改写 X_train。<\/td><\/tr><tr><td>transform(X_test)<\/td><td>用已学到的 μ、σ 转换测试输入，返回转换结果，不重新学习统计量。<\/td><\/tr><tr><td>X_test_scaled<\/td><td>接住转换后结果的变量；scaled 只是名字后缀，表示已经缩放。<\/td><\/tr><tr><td>fit_transform(X_train)<\/td><td>对同一训练数据先学习规则，再返回转换结果，是两步的简写。<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exam-note\">不能对 X_test 调用 fit_transform 来重新制定标准化规则。标签 y 不放进 X 一起标准化；缺失、无效值应按相应预处理方案处理。<\/p><\/section>\n<section class=\"worked-step\"><h4>StandardScaler 的配置参数与学到的属性<\/h4><p>公式中的 μ、σ 是从数据学到的统计量；下面的参数则是创建工具时指定的配置，二者不是同一种东西。<\/p><div class=\"table-scroll\"><table><thead><tr><th>配置参数<\/th><th>默认值<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>with_mean<\/td><td>True<\/td><td>是否减均值。False 时不做居中，输出不保证均值为 0；稀疏数据通常不能直接减均值，否则会破坏稀疏性。<\/td><\/tr><tr><td>with_std<\/td><td>True<\/td><td>是否除以缩放因子。False 时只减均值，不把标准差变成 1。<\/td><\/tr><tr><td>copy<\/td><td>True<\/td><td>是否通常使用副本；False 会尝试避免复制，但不保证一定就地修改。<\/td><\/tr><\/tbody><\/table><\/div><p>默认 fit 后可查看 <code>scaler.mean_<\/code>（每列均值）、<code>scaler.var_<\/code>（每列方差）、<code>scaler.scale_<\/code>（每列实际除数）。本例分别是 [30]、[100]、[10]。<\/p><p class=\"exam-note\">恒定列的方差为 0 时，StandardScaler 使用缩放因子 1 避免除零；默认居中后这一列变为 0，并不会得到标准差 1。不要自己在普通公式中直接除以 0。<\/p><\/section>\n<section class=\"worked-step practice\"><h4>手写自测：先解释符号，再计算<\/h4><p>训练集某特征 μ = 100、σ = 20，测试样本 x = 160。<br>1. x、μ、σ、z 分别表示什么？<br>2. z 是多少，表示什么？<br>3. 测试集平均值为 150，可以改用 150 吗？<br>4. 标准化后原有右偏会自动消失吗？<\/p><details class=\"answer\"><summary>写完再展开<\/summary><p>1. x 是当前原值，μ 是训练均值，σ 是训练标准差，z 是标准化结果。<br>2. (160 − 100) / 20 = 3，表示高于训练均值 3 个标准差。<br>3. 不可以重新用测试数据制定这套训练规则。<br>4. 不会；标准化改变尺度，保留原来的分布形状。<\/p><\/details><\/section>\n<section class=\"worked-step\"><h4>⑥ 交叉验证：每一轮都重新学习规则<\/h4><p>将用于交叉验证的数据分为 A、B、C 三折。每轮留一折验证，其余两折训练。验证折在这一轮相当于尚未见过的数据。<\/p><div class=\"table-scroll\"><table><thead><tr><th>轮次<\/th><th>训练折<\/th><th>验证折<\/th><th>填补均值从哪里算？<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>B + C<\/td><td>A<\/td><td>只从 B + C<\/td><\/tr><tr><td>2<\/td><td>A + C<\/td><td>B<\/td><td>只从 A + C<\/td><\/tr><tr><td>3<\/td><td>A + B<\/td><td>C<\/td><td>只从 A + B<\/td><\/tr><\/tbody><\/table><\/div><p>如果先用 A + B + C 算均值，然后再交叉验证，每一轮的验证折都已经参与预处理规则的学习，因此发生泄漏。把预处理和模型放入 Pipeline，再对完整 Pipeline 做交叉验证，可以让规则在每轮训练折内学习。<\/p><\/section>\n<section class=\"worked-step\"><h4>⑦ 做选择题时，检查这三个动作<\/h4><p><strong>先 split 了吗？统计量从哪份数据算？验证和测试是否只是应用规则？<\/strong><\/p><div class=\"table-scroll\"><table><thead><tr><th>说法<\/th><th>判断<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>先算全体均值，再划分 train / test<\/td><td>错误<\/td><td>测试信息参与了训练规则<\/td><\/tr><tr><td>测试缺失值使用训练均值填补<\/td><td>正确<\/td><td>应用已学到的规则<\/td><\/tr><tr><td>验证集和测试集分别重新 fit scaler<\/td><td>错误<\/td><td>重新学习了不同的转换规则<\/td><\/tr><tr><td>每轮交叉验证只在训练折 fit<\/td><td>正确<\/td><td>本轮验证折不参与规则学习<\/td><\/tr><tr><td>没有用测试标签，就绝对不会泄漏<\/td><td>错误<\/td><td>测试特征也可能泄漏到预处理中<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exam-note\">这里讨论的是需要从数据学习参数的预处理。固定单位换算等不学习数据统计量的操作，应根据实际信息流判断，不要把所有预处理都机械地视为泄漏。<\/p><\/section>\n<section class=\"worked-step practice\"><h4>合上解释，手写检查<\/h4><p>训练集年龄：10、20、30。测试集年龄：90、缺失。<br>1. 测试集的缺失年龄填多少？为什么？<br>2. 先用全部已知年龄算均值，会得到多少？问题在哪？<br>3. fit 与 transform 分别做什么？<\/p><details class=\"answer\"><summary>写完再展开答案<\/summary><p>1. 填 20，因为训练均值 = (10 + 20 + 30) ÷ 3 = 20。测试中的 90 保留。<br>2. 得到 37.5；测试集的 90 参与规则学习，造成泄漏。<br>3. fit 学习规则，transform 应用已学到的规则。<\/p><\/details><p><strong>手写总结：先划分，再学习预处理规则。训练集 fit，验证／测试集只 transform；交叉验证每轮重新 fit。<\/strong><\/p><\/section>"}]}, {"title": "5. 异常值检测", "items": [{"title": "异常值不一定是错误", "desc": "先检查来源和业务含义，再决定保留、修正或删除。", "done": false, "explanation": "异常值是相对其他观测明显不同的数据点，可能来自录入错误、设备问题，也可能是真实少见事件。检测只是提示需要调查，并不自动决定删除。", "example": "年龄 500 可能是错误；一次真实大额采购可能金额极高，却是重要业务事件。", "exam": "“所有异常值都应删除”错误；保留、修正、删除或标记都要根据来源与分析目的判断。"}, {"title": "Z-score 原理与条件", "desc": "知道它衡量离均值多少个标准差，常用于近似正态数据，也会受极端值影响。", "done": false, "explanation": "Z-score 用均值和标准差表示一个点偏离中心的程度。课件常用 |z| > 3 标记异常，更适合近似正态分布；偏态或多个群体混合时要谨慎。", "example": "大多数值集中在 50 附近，少数值在 200 附近，会拉高均值与标准差，使一些异常点不容易被该规则识别。", "exam": "|z| > 3 是常用检测规则，不是普遍真理；正负号表示高于或低于均值，判断远近要看绝对值。", "detailsHTML": "<div class=\"worked-intro\"><h3>Z-score：一个数离平均值有多远？<\/h3><p>第一周这里讲的是 <strong>Z-score（标准分数）与异常值检测<\/strong>。Z-test 是检验总体均值等假设的统计检验，虽然也会使用标准化统计量，但不是这一格的内容。<\/p><\/div>\n<section class=\"worked-step\"><h4>① 先理解“标准差”这把尺子<\/h4><p>均值告诉你数据中心在哪里；标准差描述数值围绕均值的分散程度。标准差小，数值通常比较集中；标准差大，数值通常更分散。<\/p><p>假设两班平均分都为 70：A 班标准差为 5，B 班为 20。90 分在 A 班比均值高 4 个标准差，在 B 班只高 1 个标准差。<strong>同样相差 20 分，在不同分布中“有多特别”并不相同。<\/strong><\/p><p class=\"exam-note\">标准差不是“每个数必定离均值这么远”，也不是保证所有数据都落在均值 ± 一个标准差内。这里先把它理解成衡量波动大小的尺子。<\/p><\/section>\n<section class=\"worked-step\"><h4>② 公式拆开看：先算差距，再换成标准差单位<\/h4><pre><code>z = (x − μ) / σ\n\nx：当前要检查的数值\nμ（mu）：参考数据的均值\nσ（sigma）：参考数据的标准差<\/code><\/pre><p>第一步 x − μ，得到比均值高或低多少；第二步除以 σ，得到差距相当于多少个标准差。分子分母单位相同，相除后 z 没有单位。<\/p><p>例如平均身高 170 cm、标准差 5 cm，180 cm 的 z = (180 − 170) / 5 = 2。不是“身高变成 2 cm”，而是<strong>比平均值高 2 个标准差<\/strong>。<\/p><\/section>\n<section class=\"worked-step\"><h4>③ 符号看方向，绝对值看距离<\/h4><div class=\"table-scroll\"><table><thead><tr><th>z 值<\/th><th>含义<\/th><th>离中心有多远<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>等于均值<\/td><td>0 个标准差<\/td><\/tr><tr><td>+1<\/td><td>高于均值<\/td><td>1 个标准差<\/td><\/tr><tr><td>−1<\/td><td>低于均值<\/td><td>1 个标准差<\/td><\/tr><tr><td>+4<\/td><td>高于均值<\/td><td>4 个标准差<\/td><\/tr><tr><td>−4<\/td><td>低于均值<\/td><td>4 个标准差<\/td><\/tr><\/tbody><\/table><\/div><p>−4 并不比 +4 “更不异常”。两者离中心同样远，只是方向相反，所以双侧异常检测看 |z|。<\/p><\/section>\n<section class=\"worked-step\"><h4>④ 为什么课件常用 |z| &gt; 3？<\/h4><p>对于正态分布，大约 68% 的概率落在均值 ±1σ 内，95% 在 ±2σ 内，99.7% 在 ±3σ 内。超出 ±3σ 的位置比较少见，因此常被用作潜在异常的检查边界。<\/p><pre><code>左侧潜在异常       主体范围        右侧潜在异常\nx &lt; μ − 3σ       μ − 3σ ～ μ + 3σ       x &gt; μ + 3σ\n\n等价判断：|z| &gt; 3<\/code><\/pre><p class=\"exam-note\">这些比例基于正态分布，不能套到任何数据上；3 是常用阈值，不是自然界统一的界线。被标记为异常也不代表数据一定错误。<\/p><\/section>\n<section class=\"worked-step\"><h4>⑤ 适用条件与局限：异常点也能拉动这把尺子<\/h4><p>基于均值和标准差的 ±3σ 规则通常更适合近似正态、单一主体分布的数据。偏态、多个群体混合或明显极端值可能使判断失真。<\/p><p>看一组实际计算的数据：<strong>48、49、50、51、52、200<\/strong>。前五个数集中在 50 附近，200 远离主体；但把六个数一起计算，均值为 75，总体标准差约为 55.92。<\/p><pre><code>z(200) = (200 − 75) / 55.92 ≈ 2.24\n\n2.24 &lt; 3 → 这条规则没有标记 200<\/code><\/pre><p>原因是 200 同时拉高了均值和标准差，使它自己的标准化距离变小。这说明<strong>没有被 Z-score 标记，不等于一定正常<\/strong>。可结合图表、业务规则和 IQR 等其他方法检查。<\/p><p class=\"exam-note\">计算 Z-score 本身不要求正态；需要谨慎的是把某个 z 阈值解释为“少见程度”。Z-score 也不会把偏态数据自动变成正态。<\/p><\/section>\n<section class=\"worked-step\"><h4>⑥ 与 StandardScaler 的关系<\/h4><p>两者都使用减均值、除标准差的计算。异常检测用 z 判断一个点是否离中心太远；StandardScaler 用标准化后的值作为模型输入，解决尺度问题。<strong>计算相似，用途不同。<\/strong><\/p><p>在机器学习流程中，如果用这项规则决定训练数据处理，应只从当前训练数据学习均值、标准差和阈值，再按确定的规则处理验证／测试。不要用测试数据重新制定训练规则。<\/p><p class=\"exam-note\">软件可能采用总体标准差或样本标准差。题目给定 σ 时直接用给定值；自己计算时遵循题目或软件约定，不混用分母 n 与 n−1。<\/p><\/section>"}, {"title": "Z-score 简单计算", "desc": "会用 `z = (x - mean) / std`，理解课件中的 `|z| > 3` 判定规则。", "done": false, "explanation": "公式：z = (x − μ) / σ，其中 μ 是均值，σ 是标准差。先减均值，再除标准差，最后与题目给定的阈值比较。", "example": "μ = 50，σ = 10，x = 90：z = (90 − 50) / 10 = 4，按 |z| > 3 属于异常；x = 20 时 z = −3，不满足严格大于 3。", "exam": "注意 > 与 ≥ 的区别，负方向也可能异常。标准差为 0 时不能直接使用这个除法。", "detailsHTML": "<div class=\"worked-intro\"><h3>一步一步算 Z-score<\/h3><p>本例统一使用：均值 μ = 50，标准差 σ = 10，异常规则 |z| &gt; 3。<\/p><\/div>\n<section class=\"worked-step\"><h4>① 检查 x = 90<\/h4><pre><code>1. 差距：90 − 50 = 40\n2. 换单位：40 ÷ 10 = 4\n3. 看方向：z = +4，高于均值\n4. 看距离：|4| = 4，超过 3\n结论：按本题规则，90 被标记为潜在异常。<\/code><\/pre><\/section>\n<section class=\"worked-step\"><h4>② 检查 x = 10：小值也可能异常<\/h4><pre><code>z = (10 − 50) / 10 = −4\n|z| = 4 &gt; 3\n结论：按本题规则，10 也被标记为潜在异常。<\/code><\/pre><p>不能只判断 z &gt; 3，否则会漏掉左侧的小值异常。<\/p><\/section>\n<section class=\"worked-step\"><h4>③ 检查 x = 80：注意“&gt;”与“≥”<\/h4><pre><code>z = (80 − 50) / 10 = 3\n|z| = 3，不满足 |z| &gt; 3\n结论：按严格大于 3 的规则，不标记。<\/code><\/pre><p>如果题目改成 |z| ≥ 3，则 80 会被标记。做题时严格跟随给定条件，不把两种规则混为一谈。<\/p><\/section>\n<section class=\"worked-step\"><h4>④ 不算每个 z，也可以先算原数值边界<\/h4><pre><code>下界 = μ − 3σ = 50 − 3×10 = 20\n上界 = μ + 3σ = 50 + 3×10 = 80\n\n严格规则：x &lt; 20 或 x &gt; 80 → 潜在异常<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>x<\/th><th>z<\/th><th>|z|<\/th><th>按 |z| &gt; 3 标记？<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>−4<\/td><td>4<\/td><td>是<\/td><\/tr><tr><td>20<\/td><td>−3<\/td><td>3<\/td><td>否，恰好在边界<\/td><\/tr><tr><td>40<\/td><td>−1<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>50<\/td><td>0<\/td><td>0<\/td><td>否<\/td><\/tr><tr><td>80<\/td><td>3<\/td><td>3<\/td><td>否，恰好在边界<\/td><\/tr><tr><td>90<\/td><td>4<\/td><td>4<\/td><td>是<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exam-note\">如果 σ = 0，所有参考值相同，普通公式不能直接除以零；不能沿用上面的计算。缺失值也应先按规定识别，不当作普通数值直接计算。<\/p><\/section>\n<section class=\"worked-step practice\"><h4>合上解释，手写一遍<\/h4><p>换一组条件：μ = 100，σ = 20，规则 |z| &gt; 3。<br>1. x = 180：z 是多少，是否标记？<br>2. x = 40：z 是多少，是否标记？<br>3. x = 20：z 是多少，是否标记？<br>4. 原数值的上下边界是多少？<br>5. “z 为负数就一定异常”对吗？<\/p><details class=\"answer\"><summary>先算完，再看答案<\/summary><p>1. z = 4，标记。<br>2. z = −3，严格规则下不标记。<br>3. z = −4，标记。<br>4. 下界 40，上界 160；小于 40 或大于 160 时标记。<br>5. 错。负号只表示低于均值，异常判断还要看绝对值与阈值。<\/p><\/details><p><strong>手写总结：先减均值，再除标准差；符号看方向，绝对值看距离；异常不等于错误。<\/strong><\/p><\/section>"}, {"title": "IQR 原理与条件", "desc": "理解 Q1、Q3 和 IQR，知道它比均值与标准差对极端值更稳健。", "done": false, "explanation": "Q1 是第 25 百分位，Q3 是第 75 百分位；IQR = Q3 − Q1，描述中间 50% 数据的跨度。基于四分位数的规则对极端值通常比均值和标准差更稳健。", "example": "主体集中、右侧有少数很大数值时，可以用 IQR 边界寻找潜在异常，再结合业务核查。", "exam": "IQR 不要求正态分布，但也不保证对所有分布都最佳。不同四分位数计算方式可能得到略有不同的结果。"}, {"title": "IQR 简单计算", "desc": "会计算 `IQR = Q3 - Q1`，以及 `Q1 - 1.5 × IQR`、`Q3 + 1.5 × IQR` 两个边界。", "done": false, "explanation": "下界 = Q1 − 1.5 × IQR；上界 = Q3 + 1.5 × IQR。小于下界或大于上界的点按这条规则被标记为潜在异常。", "example": "Q1 = 40，Q3 = 60，则 IQR = 20，下界 = 10，上界 = 90；5 和 100 超出边界，50 没有超出。", "exam": "先计算 Q3 − Q1，不能用最大值减最小值代替 IQR。通常恰好等于边界的值不算超出。"}, {"title": "Isolation Forest", "desc": "理解异常点通常更容易被随机切分隔离，路径更短。", "done": false, "explanation": "Isolation Forest 用随机选择特征和切分位置构造树。少见且与主体不同的点往往较早被隔离，因此平均路径较短；它不依赖数据必须服从正态分布。", "example": "主体形成密集群体，一个远离主体的点可能几次随机切分就被分离，而群体内部的点需要更多切分。", "exam": "路径短通常更可能异常；它并不是先拟合正态分布再算 Z-score，也不能把每个被标记的点都认定为错误。"}, {"title": "LOF", "desc": "理解它比较一个点与邻居的局部密度，识别局部异常。", "done": false, "explanation": "Local Outlier Factor 比较一个点与其邻居的局部密度。若它所在位置明显比周围邻居稀疏，LOF 会提示局部异常，适合关注不同密度区域中的异常。", "example": "某个点离全局中心不远，但周围形成密集小群体，而它独自落在群体外，也可能成为局部异常。", "exam": "LOF 约为 1 表示局部密度相近，明显大于 1 更可能异常。它看局部邻域，不只是看离总体均值多远。"}, {"title": "DBSCAN", "desc": "理解密度聚类与噪声点的基本概念。", "done": false, "explanation": "DBSCAN 根据邻域半径 eps 和最少邻居数量 min_samples 找密集区域，将可连接的密集区域组成簇，无法归入簇的点可能被标为噪声。", "example": "散点图中两个密集团可以形成两个簇；孤立点可能被标为 noise。特征尺度和参数会影响邻域与结果。", "exam": "噪声点是算法在当前参数下的判断，不等于数据错误；密度差异很大时，单一参数可能难以适合所有群体。"}, {"title": "方法选择综合题", "desc": "能根据近似正态、偏态、局部密度等特点选择方法，并解释限制。", "done": false, "explanation": "先看分布是否近似正态、是否偏态、是否存在多个特征和不同局部密度，再选择检测方法。方法应匹配数据特点，检测结果还要回到业务语义核查。", "example": "近似正态的一列可考虑 Z-score；偏态可考虑 IQR；多维且不想假设正态可考虑 Isolation Forest；局部密度异常可考虑 LOF。", "exam": "“某方法永远最好”通常不成立。要能解释适用条件、参数影响及可能遗漏的异常。"}]}, {"title": "6. 第一周验收", "items": [{"title": "合上笔记，写出六阶段流程，并为每个阶段举一个例子", "desc": "", "done": false, "explanation": "不看清单，按顺序写出 Ask、Prepare、Process、Analyze、Share、Act，并用同一个案例为每一步写一句操作。", "example": "网店案例可以从定义销量指标，一直写到调整营销及监测结果。完成后再打开前面的解释核对。", "exam": "能区分相邻阶段才勾选：特别检查 Prepare 与 Process，以及 Share 与 Act。"}, {"title": "给一张小表，找出数据类型、缺失、重复、无效值和潜在异常", "desc": "", "done": false, "explanation": "自己画一张 5 行左右的小表，加入缺失年龄、同名客户、负年龄、单位不一致和极端收入，逐项说明问题与处理依据。", "example": "两个同名客户要看 ID；极端收入先核查；负年龄不能直接作为正常数值分析。", "exam": "至少能区分缺失、无效和异常，并解释为什么同名或极端值不能直接删除。"}, {"title": "完成一道 Z-score 题和一道 IQR 题，并解释计算结果", "desc": "", "done": false, "explanation": "各做一题，写出公式、代入数值、计算结果和判定理由，不仅写“异常”两个字。", "example": "Z-score：μ = 100、σ = 20、x = 180；IQR：Q1 = 20、Q3 = 40，判断 x = 75 是否超出上界。", "exam": "自己先算，再核对：前题 z = 4；后题 IQR = 20，上界 = 70，75 超出。注意阈值的严格程度。"}, {"title": "完成混合选择题，对每个选项分别说明理由", "desc": "", "done": false, "explanation": "混合练习要覆盖阶段、数据类型、EDA 目标、清洗选择和异常检测。对不定项选择的每个选项独立判断，并写出依据。", "example": "看到“EDA 的目标是自动选择特征”，需要区分“探索可以提供依据”与“主要目标是自动化选择”。", "exam": "不猜正确选项数量；遇到 always、must、guarantee，检查有没有遗漏适用条件。"}, {"title": "重做错题，能解释此前混淆的概念", "desc": "", "done": false, "explanation": "把错题改写成一句概念区别，然后隔一段时间不看答案重做。只有换个例子也能解释，才说明理解比记住答案更稳定。", "example": "记录“缺失不等于零”“异常不等于错误”“Prepare 收集数据，Process 清洗数据”，再给每句配一个新例子。", "exam": "重做时不仅选对，还要能指出原来的误解和错误选项的具体问题。"}]}]}, "week2": {"label": "第二周", "subtitle": "Feature Engineering, Scaling and Bias Mitigation", "storageKey": "aai-ca6003-week2-checklist-v1", "groups": [{"title": "1. 类别编码 · Data Encoding", "items": [{"title": "为什么需要编码？", "explanation": "类别编码把文字类别转换成模型可以处理的数值表示。选择方式要考虑类别有无顺序、不同类别数量（cardinality）、模型类型以及是否使用目标信息。", "example": "产品表中 Size = Small / Medium / Large，Color = Red / Blue，Supplier 有上百家公司；三个字段不一定使用同一种编码。", "exam": "编码是表示类别，不是保证预测更准。用数字代替文字也可能引入虚假的顺序或距离。", "done": false}, {"title": "Ordinal / Label Encoding：有序类别", "explanation": "Ordinal encoding 按自然顺序赋值，例如 Small < Medium < Large。要区分给有序输入编码与把目标类别转换成标签；数字编号本身不创造真实顺序。", "example": "Size：Small → 1，Medium → 2，Large → 3。Color：Red → 1、Blue → 2、Green → 3 则可能错误暗示颜色有大小关系。", "exam": "适合有自然顺序的输入类别；1、2、3 也不保证实际间隔相等。不能说所有类别都适合 ordinal encoding。", "done": false}, {"title": "One-Hot Encoding：无序类别", "explanation": "为每个类别创建一个指示列，属于该类别填 1，否则填 0。常用于无序且类别数较少的数据，避免强行赋予类别顺序。", "example": "Color 有 Red、Blue、Green：Red → [1,0,0]，Blue → [0,1,0]，Green → [0,0,1]。输出是三列，而不是一列编号。", "exam": "类别很多时列数增加，形成高维稀疏表示。部分实现会 drop 一列；遇到新类别的处理方式需要提前设置。", "done": false}, {"title": "Count / Frequency Encoding：按出现频次", "explanation": "Count encoding 用类别出现次数替换类别；frequency encoding 用出现次数除以总数。通常保留一个数值列，但不同类别可能出现相同频次，失去区分。", "example": "训练数据 Supplier = A、A、A、B、C。Count：A → 3，B → 1，C → 1；Frequency：A → 0.6，B → 0.2，C → 0.2。", "exam": "B 与 C 编码相同，说明频次编码可能合并不同类别的信息。计算频次只用训练数据；它不使用目标 y。", "done": false}, {"title": "Binary Encoding：类别编号再转二进制", "explanation": "先给每个类别分配编号，再把编号写成二进制，用若干位构成新列。它通常比 one-hot 列数少，但每一位的意义不直观，仍可能引入人为关系。", "example": "4 个供应商编号 1、2、3、4，用三位表示：001、010、011、100。实际列数取决于编号和实现约定。", "exam": "Binary encoding 不是把任意类别只变成 0 或 1 一列，也不是 hash encoding；已知类别可保持不同位模式，但不保证模型适配。", "done": false}, {"title": "Target Encoding：用类别对应的目标均值", "explanation": "Target encoding 将输入类别替换成该类别在训练数据中的目标均值。连续目标取平均值，二分类 0/1 目标的平均值等于正类比例，适合考虑高基数类别。", "example": "Supplier A 的售价为 100、200，则 A 编成 150；若 A 的购买标签为 1、0、1，则编码为 2/3，约 0.667。", "exam": "它用到了目标 y，因此比 frequency encoding 更要防止泄漏和过拟合；少量样本类别的均值尤其不稳定。", "done": false}, {"title": "Smoothing：让小样本均值靠近总体均值", "explanation": "把类别均值与训练数据的总体目标均值进行加权平均。课件的伪计数形式为 (n × 类别均值 + m × 总体均值) / (n + m)，其中 m 是平滑强度。", "example": "某类别 n = 2，类别均值 100，总体均值 50，m = 3：平滑结果 = (2×100 + 3×50) / 5 = 70。", "exam": "m 增大时更靠近总体均值；n 增大时更信任类别均值。总体均值也必须来自当前可用的训练数据；库实现可能采用 sigmoid 权重。", "done": false}, {"title": "Out-of-Fold Target Encoding：避免看见自己的答案", "explanation": "对训练数据分折，每一折的编码由其他训练折的类别目标均值产生，使一条记录的目标不参与它自己的编码。验证／测试使用外层训练集学习的映射。", "example": "A 折的供应商编码从 B、C、D 的 y 计算，不能使用 A 的 y。若某类别只出现一次，直接用自身 y 编码会把答案放进输入。", "exam": "Smoothing 降低不稳定性，但不能代替 OOF 防泄漏。嵌套在模型交叉验证中时，编码流程也要限制在本轮训练数据内。", "done": false}, {"title": "Hash Encoding：固定维度与碰撞", "explanation": "通过哈希函数把类别映射到固定数量的 bins，适合非常多的类别或大词汇表，不必为每个类别单独增加一列。代价是可能碰撞。", "example": "设有 4 个 bins，apple 和 apricot 都被映射到第 2 个 bin，此时该表示不能区分它们。", "exam": "固定列数不等于零信息损失；增加 bins 往往可减少碰撞，但增加内存。它与 binary encoding 的不同位模式不是同一机制。", "done": false}, {"title": "编码方法综合选择", "explanation": "先问有无自然顺序，再看类别数量、目标可用性、列数成本和模型。课件的低／高基数举例用于理解取舍，不是所有任务通用的硬阈值。", "example": "Size 可考虑 ordinal；少量颜色可考虑 one-hot；大量供应商比较 binary、frequency 或 target；巨大词汇表可考虑 hash。", "exam": "没有永远最佳的编码。要能说明维度、碰撞、虚假顺序、解释性以及泄漏方面的取舍。", "done": false}]}, {"title": "2. 特征缩放 · Feature Scaling", "items": [{"title": "为什么不同尺度会影响模型？", "explanation": "不同列的数值量级可能相差很大。距离计算和某些优化算法会受尺度影响，所以用缩放减少量级造成的主导效应。缩放不保证各特征的重要性相等。", "example": "年龄约 20～60，收入约 30,000～200,000。KNN 直接算距离时，收入的数值差可能压过年龄差。", "exam": "KNN、K-means、SVM、PCA 和梯度优化常需考虑缩放；树模型按阈值切分，通常不需要因量级差而缩放。", "done": false}, {"title": "StandardScaler：均值与标准差", "explanation": "对每列做 z = (x − μ_train) / σ_train。训练集的非恒定列转换后通常均值约 0、标准差约 1；它保持分布形状，且对异常值敏感。", "example": "μ = 70，σ = 10：60 → −1，70 → 0，90 → 2。少数极端值会拉动均值与标准差，使主体数据挤在更窄区间。", "exam": "不要求原数据必须正态；不会自动变成正态，也没有固定上下限。验证／测试使用训练统计量，不一定均值 0、标准差 1。", "done": false, "detailsHTML": "<section class=\"worked-step\"><h4>StandardScaler：先看懂公式中的每一个符号<\/h4><pre><code>z = (x − μ_train) / σ_train<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>符号<\/th><th>读法／含义<\/th><th>从哪里来？<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>当前这个样本某个特征的原始数值<\/td><td>可以来自训练、验证或测试。例如当前客户年龄 40。<\/td><\/tr><tr><td>μ_train<\/td><td>mu：该特征在训练集中的平均值<\/td><td>只用训练集这一列计算，不是所有列混在一起算。<\/td><\/tr><tr><td>σ_train<\/td><td>sigma：该特征在训练集中的标准差<\/td><td>衡量该列数值围绕均值的波动程度，由训练数据计算。<\/td><\/tr><tr><td>train<\/td><td>下标，表示统计量来自训练集<\/td><td>不是参与乘法的参数，也不是当前 x 必须来自训练集。<\/td><\/tr><tr><td>z<\/td><td>转换后的标准化数值，没有单位<\/td><td>表示 x 高于或低于训练均值多少个训练标准差。<\/td><\/tr><\/tbody><\/table><\/div><p><strong>先减均值：<\/strong>确定离中心多远；<strong>再除标准差：<\/strong>将距离换成“几个标准差”。正号表示高于均值，负号表示低于均值，0 表示等于均值。<\/p><\/section>\n<section class=\"worked-step\"><h4>完整例子：从原始年龄算出均值、标准差，再转换<\/h4><p>训练集年龄为 <strong>20、20、40、40<\/strong>。下面使用 StandardScaler 默认的总体标准差约定，分母是 n，不是 n−1。<\/p><pre><code>① 训练均值 μ = (20 + 20 + 40 + 40) / 4 = 30\n② 每个值减均值：−10、−10、10、10\n③ 差距平方：100、100、100、100\n④ 平方差的均值（方差）：400 / 4 = 100\n⑤ 标准差 σ = √100 = 10\n⑥ 标准化：z = (x − 30) / 10<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>原始年龄 x<\/th><th>代入公式<\/th><th>结果 z<\/th><th>怎么理解<\/th><\/tr><\/thead><tbody><tr><td>20（训练）<\/td><td>(20 − 30) / 10<\/td><td>−1<\/td><td>低于训练均值 1 个标准差<\/td><\/tr><tr><td>40（训练）<\/td><td>(40 − 30) / 10<\/td><td>1<\/td><td>高于训练均值 1 个标准差<\/td><\/tr><tr><td>30（新客户）<\/td><td>(30 − 30) / 10<\/td><td>0<\/td><td>恰好等于训练均值<\/td><\/tr><tr><td>50（测试）<\/td><td>(50 − 30) / 10<\/td><td>2<\/td><td>高于训练均值 2 个标准差<\/td><\/tr><tr><td>10（测试）<\/td><td>(10 − 30) / 10<\/td><td>−2<\/td><td>低于训练均值 2 个标准差<\/td><\/tr><\/tbody><\/table><\/div><p>训练集转换成 −1、−1、1、1，均值为 0、总体标准差为 1。测试值即使更大或更小，也继续使用 μ = 30、σ = 10。<strong>标准化不限制数值只能在 −1～1 或 0～1。<\/strong><\/p><p class=\"exam-note\">σ 是分散程度，不是所有点与均值的平均绝对距离。本例差距恰好都为 10，但一般数据需要按平方差再开根号计算。<\/p><\/section>\n<section class=\"worked-step\"><h4>每一列分别计算，不把年龄和收入混起来<\/h4><p>如果有 Age 和 Income 两列，fit 会学习两套统计量。假设年龄的 μ = 30、σ = 10，收入的 μ = 5,000、σ = 1,000，则客户 [40, 7,000] 转换成 [1, 2]。<\/p><pre><code>Age：   (40 − 30) / 10 = 1\nIncome：(7000 − 5000) / 1000 = 2<\/code><\/pre><p>两个特征各自用自己的尺子标准化；转换后容易比较“偏离本列中心的程度”，但不能由此断言收入比年龄重要两倍。<\/p><\/section>\n<section class=\"worked-step\"><h4>代码里的每个名字是什么意思？<\/h4><pre><code>from sklearn.preprocessing import StandardScaler\n\nscaler = StandardScaler()\nscaler.fit(X_train)\n\nX_train_scaled = scaler.transform(X_train)\nX_val_scaled = scaler.transform(X_val)\nX_test_scaled = scaler.transform(X_test)<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>名字／操作<\/th><th>意思<\/th><\/tr><\/thead><tbody><tr><td>scaler<\/td><td>保存标准化规则的对象；fit 后保存每列均值、方差和缩放因子。<\/td><\/tr><tr><td>X_train / X_val / X_test<\/td><td>训练／验证／测试的输入特征表。大写 X 常表示多行多列；目标答案一般记作 y。<\/td><\/tr><tr><td>fit(X_train)<\/td><td>从训练特征学习 μ、σ，不是直接训练预测模型，也不会就地改写 X_train。<\/td><\/tr><tr><td>transform(X_test)<\/td><td>用已学到的 μ、σ 转换测试输入，返回转换结果，不重新学习统计量。<\/td><\/tr><tr><td>X_test_scaled<\/td><td>接住转换后结果的变量；scaled 只是名字后缀，表示已经缩放。<\/td><\/tr><tr><td>fit_transform(X_train)<\/td><td>对同一训练数据先学习规则，再返回转换结果，是两步的简写。<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exam-note\">不能对 X_test 调用 fit_transform 来重新制定标准化规则。标签 y 不放进 X 一起标准化；缺失、无效值应按相应预处理方案处理。<\/p><\/section>\n<section class=\"worked-step\"><h4>StandardScaler 的配置参数与学到的属性<\/h4><p>公式中的 μ、σ 是从数据学到的统计量；下面的参数则是创建工具时指定的配置，二者不是同一种东西。<\/p><div class=\"table-scroll\"><table><thead><tr><th>配置参数<\/th><th>默认值<\/th><th>作用<\/th><\/tr><\/thead><tbody><tr><td>with_mean<\/td><td>True<\/td><td>是否减均值。False 时不做居中，输出不保证均值为 0；稀疏数据通常不能直接减均值，否则会破坏稀疏性。<\/td><\/tr><tr><td>with_std<\/td><td>True<\/td><td>是否除以缩放因子。False 时只减均值，不把标准差变成 1。<\/td><\/tr><tr><td>copy<\/td><td>True<\/td><td>是否通常使用副本；False 会尝试避免复制，但不保证一定就地修改。<\/td><\/tr><\/tbody><\/table><\/div><p>默认 fit 后可查看 <code>scaler.mean_<\/code>（每列均值）、<code>scaler.var_<\/code>（每列方差）、<code>scaler.scale_<\/code>（每列实际除数）。本例分别是 [30]、[100]、[10]。<\/p><p class=\"exam-note\">恒定列的方差为 0 时，StandardScaler 使用缩放因子 1 避免除零；默认居中后这一列变为 0，并不会得到标准差 1。不要自己在普通公式中直接除以 0。<\/p><\/section>\n<section class=\"worked-step practice\"><h4>手写自测：先解释符号，再计算<\/h4><p>训练集某特征 μ = 100、σ = 20，测试样本 x = 160。<br>1. x、μ、σ、z 分别表示什么？<br>2. z 是多少，表示什么？<br>3. 测试集平均值为 150，可以改用 150 吗？<br>4. 标准化后原有右偏会自动消失吗？<\/p><details class=\"answer\"><summary>写完再展开<\/summary><p>1. x 是当前原值，μ 是训练均值，σ 是训练标准差，z 是标准化结果。<br>2. (160 − 100) / 20 = 3，表示高于训练均值 3 个标准差。<br>3. 不可以重新用测试数据制定这套训练规则。<br>4. 不会；标准化改变尺度，保留原来的分布形状。<\/p><\/details><\/section>"}, {"title": "MinMaxScaler：映射到指定区间", "explanation": "默认用 (x − min_train) / (max_train − min_train) 映射训练数据到 0～1。最小最大值受异常值影响，主体可能被压缩。", "example": "训练值 10、20、30：10 → 0，20 → 0.5，30 → 1；测试值 40 使用同一规则时得到 1.5。", "exam": "默认不启用 clip 时，超出训练范围的新值可超出 0～1。不能说所有未来数据永远在 0～1，也不能说它消除异常值。", "done": false}, {"title": "RobustScaler：中位数与 IQR", "explanation": "默认用 (x − median_train) / IQR_train，中心由中位数确定，尺度由中间 50% 数据的跨度确定，通常对极端值更稳健。", "example": "median = 50，Q1 = 40，Q3 = 60，则 IQR = 20；x = 70 → 1，x = 200 → 7.5。极端值仍保留，只是不容易拉动主体的尺度。", "exam": "Robust 不等于自动删除异常，也没有固定范围。“数据有明显极端值时可考虑 RobustScaler”比“永远最佳”更准确。", "done": false}, {"title": "MaxAbsScaler：保留零与稀疏性", "explanation": "每列除以训练数据中最大的绝对值，不减去均值，因此 0 仍然是 0，适合需要保留稀疏结构的数据。但最大绝对值会受极端值影响。", "example": "训练数据 −4、0、2，最大绝对值为 4：转换成 −1、0、0.5。", "exam": "训练范围落在 −1～1；未来值若超过训练最大绝对值，也可能超出范围。保留零不等于对异常值稳健。", "done": false}, {"title": "Scaler 选择与泄漏检查", "explanation": "按数据分布、极端值、稀疏性、范围需求和模型选择。先 split，再仅在训练数据 fit，验证／测试只 transform；每个交叉验证训练轮次独立学习规则。", "example": "明显极端值可考虑 RobustScaler；稀疏词频可考虑 MaxAbsScaler；需要指定训练区间可考虑 MinMaxScaler；常规标准化用 StandardScaler。", "exam": "Scaling 改变尺度，不会自动改变偏态形状。不能先用整个数据集算缩放统计量，再进行交叉验证。", "done": false}]}, {"title": "3. 分布与幂变换 · Power Transformation", "items": [{"title": "偏态：看尾巴朝哪边", "explanation": "右偏（positive skew）是右侧长尾，主体常集中在较小值；左偏（negative skew）是左侧长尾。对称不意味着一定正态，偏度为零也不足以证明正态。", "example": "多数收入在较低区间，少数收入极高，形成右长尾；多数考试成绩较高，少数很低，可能形成左长尾。", "exam": "用长尾方向命名，不是看最高柱子的位置。不要把“对称”直接等同于“正态”。", "done": false, "detailsHTML": "<div class=\"worked-intro\"><h3>先看数据：尾巴在哪边？<\/h3><\/div><div class=\"table-scroll\"><table><thead><tr><th>类型<\/th><th>从小到大排列的数据<\/th><th>怎么判断<\/th><\/tr><\/thead><tbody><tr><td>右偏 / Positive skew<\/td><td>10、11、12、12、13、14、100<\/td><td>多数集中在 10～14，少数大值延伸到右边的 100<\/td><\/tr><tr><td>左偏 / Negative skew<\/td><td>0、86、87、88、88、89、90<\/td><td>多数集中在 86～90，少数小值延伸到左边的 0<\/td><\/tr><tr><td>对称示例<\/td><td>10、20、30、40、50<\/td><td>以 30 为中心，两侧对应数值距离相同<\/td><\/tr><\/tbody><\/table><\/div><section class=\"worked-step\"><h4>右偏例子：均值为什么被拉高？<\/h4><pre><code>数据：10、11、12、12、13、14、100\n均值 = 172 / 7 ≈ 24.57\n中位数 = 第 4 个数 = 12<\/code><\/pre><p>100 拉高均值，但中位数仍是 12。左偏例子的均值约 75.43，中位数为 88，少数低分则把均值往下拉。<\/p><p class=\"exam-note\">这些例子是用来理解尾巴方向。mean 与 median 的相对位置是常见线索，不是所有分布通用的充分判断；对称也不证明正态。<\/p><\/section><section class=\"worked-step practice\"><h4>手写判断<\/h4><p>收入：3、4、4、5、6、50（万元），是哪种偏态？主体在哪里，尾巴在哪里？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>右偏。主体在 3～6 万元，50 万元形成右侧长尾。不要因为主体在左侧就叫“左偏”。<\/p><\/details><\/section>"}, {"title": "Scaling 与 Power Transformation 的区别", "explanation": "缩放通常是线性平移和缩放，保留分布形状；幂变换是非线性变换，旨在减少偏态、稳定方差，可能帮助特定模型更好地拟合。", "example": "数据 1、10、100 取 log10 后变成 0、1、2，大值之间的差距被明显压缩；简单除以 100 得到 0.01、0.1、1，原有比例形状仍保留。", "exam": "StandardScaler 不能代替减少偏态的变换；幂变换也不保证模型一定更好或数据完美正态。", "done": false, "detailsHTML": "<div class=\"worked-intro\"><h3>同一组数据，比较“缩放”与“改变形状”<\/h3><p>取收入示例 1、10、100、1000。下面的 log10 是以 10 为底的对数；这些值是 10 的整数次幂，所以很好手算。<\/p><\/div><div class=\"table-scroll\"><table><thead><tr><th>原值 x<\/th><th>线性缩放 x / 1000<\/th><th>非线性变换 log10(x)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0.001<\/td><td>0，因为 10⁰ = 1<\/td><\/tr><tr><td>10<\/td><td>0.01<\/td><td>1，因为 10¹ = 10<\/td><\/tr><tr><td>100<\/td><td>0.1<\/td><td>2，因为 10² = 100<\/td><\/tr><tr><td>1000<\/td><td>1<\/td><td>3，因为 10³ = 1000<\/td><\/tr><\/tbody><\/table><\/div><section class=\"worked-step\"><h4>看相邻差距，区别就清楚了<\/h4><pre><code>原数据差距：     9、90、900\n除以 1000 后：   0.009、0.09、0.9\nlog10 后：      1、1、1<\/code><\/pre><p>线性缩放对所有差距乘同一个比例，大小差距的结构保留。对数则更强地压缩大数，把相同倍数的变化转换成相同距离，可能减轻右偏。<\/p><p class=\"exam-note\">StandardScaler 和 MinMaxScaler 也是线性平移／缩放，不能仅靠它们消除偏态。四个数变成等间距不等于证明新分布是正态。<\/p><\/section><section class=\"worked-step\"><h4>平方根也是一种温和的压缩<\/h4><pre><code>原值：  1、4、9、100\n平方根：1、2、3、10<\/code><\/pre><p>平方根适用于非负值，通常比 log 对大值的压缩温和。普通 log 要求 x &gt; 0；非负数据含零时可考虑 log1p(x) = ln(1+x)，但不能靠它直接处理任意负数。<\/p><\/section><section class=\"worked-step practice\"><h4>你来算<\/h4><p>10、100、1000 取 log10 后分别是多少？只是把这三个数除以 1000，会得到相同效果吗？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>log10 后是 1、2、3；除以 1000 后是 0.01、0.1、1，两种处理改变差距的方式不同。<\/p><\/details><\/section>"}, {"title": "Box-Cox：必须严格为正", "explanation": "Box-Cox 是带参数 λ 的一族幂变换；λ = 0 时对应 log，其他情况使用 (x^λ − 1) / λ。它要求输入 x > 0，λ 从训练数据学习。", "example": "正的收入或关注者数量可考虑；数据 [0, 2, 5] 含 0，不能直接使用 Box-Cox。", "exam": "“非负”不够，零也不允许。不能未经说明给所有值随便加一个常数；变换选择须结合含义。", "done": false, "detailsHTML": "<div class=\"worked-intro\"><h3>Box-Cox：同一组正数，不同 λ 怎么变？<\/h3><\/div><pre><code>λ ≠ 0：y = (x^λ − 1) / λ\nλ = 0：y = ln(x)\n要求：x &gt; 0<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>符号<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>原始数值，必须严格大于 0<\/td><\/tr><tr><td>λ（lambda）<\/td><td>控制变换方式的参数，通常从训练数据拟合<\/td><\/tr><tr><td>x^λ<\/td><td>x 的 λ 次方；λ = 0.5 时是平方根<\/td><\/tr><tr><td>y<\/td><td>变换后的值，不是此处的目标标签<\/td><\/tr><tr><td>ln(x)<\/td><td>自然对数，以 e 为底；不是 log10，但同样压缩正的大值<\/td><\/tr><\/tbody><\/table><\/div><section class=\"worked-step\"><h4>先固定 λ = 0.5，练代入<\/h4><pre><code>x = 9，λ = 0.5\nx^λ = √9 = 3\ny = (3 − 1) / 0.5 = 4<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>x<\/th><th>λ = 0.5：2(√x − 1)<\/th><th>λ = 0：ln(x)，约值<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>2<\/td><td>1.386<\/td><\/tr><tr><td>9<\/td><td>4<\/td><td>2.197<\/td><\/tr><tr><td>100<\/td><td>18<\/td><td>4.605<\/td><\/tr><\/tbody><\/table><\/div><p>λ = 1 时结果是 x − 1，只做平移；λ = 0.5 时与平方根有关；λ = 0 时用 log 分支。<strong>λ = 0 不能代入第一条公式直接除以 0。<\/strong><\/p><p class=\"exam-note\">这里人为固定 λ 只是方便练公式，不是说所有数据都应该选 0.5。真实流程中只在训练数据拟合 λ，验证／测试使用同一参数。<\/p><\/section><section class=\"worked-step\"><h4>哪些输入可以直接用？<\/h4><p>[1, 4, 9]：可以；[0, 4, 9]：不可以，有零；[−1, 4, 9]：不可以，有负数。<strong>输入严格为正，不代表输出必须为正<\/strong>，例如 λ = 0、x = 0.5 时 ln(0.5) 约为 −0.693。<\/p><\/section><section class=\"worked-step practice\"><h4>手写练习<\/h4><p>x = 16、λ = 0.5，Box-Cox 结果是多少？x = 0 能否直接使用？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>(√16 − 1) / 0.5 = (4 − 1) / 0.5 = 6。x = 0 不符合严格正值要求。<\/p><\/details><\/section>"}, {"title": "Yeo-Johnson：允许零和负数", "explanation": "Yeo-Johnson 使用分段的幂变换，可以处理正值、零和负值。它也需要从训练数据拟合参数，目标是减轻偏态等问题，不是保证正态。", "example": "利润数据 [−100, 0, 20, 300] 含亏损与零，若需要幂变换，可以考虑 Yeo-Johnson。", "exam": "允许负数的是 Yeo-Johnson，不是 Box-Cox；测试数据使用训练阶段学到的参数。", "done": false, "detailsHTML": "<div class=\"worked-intro\"><h3>Yeo-Johnson：有负数时怎么计算？<\/h3><p>它根据 x 的正负采用不同分支，从而允许正值、零和负值。先不用背所有分支，先看固定 λ = 0 的具体例子。<\/p><\/div><pre><code>本例固定 λ = 0：\n如果 x ≥ 0：y = ln(1 + x)\n如果 x &lt; 0：y = −((1 − x)² − 1) / 2<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>原值 x<\/th><th>选哪个分支？<\/th><th>代入<\/th><th>结果 y<\/th><\/tr><\/thead><tbody><tr><td>−2<\/td><td>负数分支<\/td><td>−((1+2)²−1)/2 = −8/2<\/td><td>−4<\/td><\/tr><tr><td>−1<\/td><td>负数分支<\/td><td>−((1+1)²−1)/2 = −3/2<\/td><td>−1.5<\/td><\/tr><tr><td>0<\/td><td>非负分支<\/td><td>ln(1)<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>非负分支<\/td><td>ln(2)<\/td><td>约 0.693<\/td><\/tr><tr><td>3<\/td><td>非负分支<\/td><td>ln(4)<\/td><td>约 1.386<\/td><\/tr><tr><td>8<\/td><td>非负分支<\/td><td>ln(9)<\/td><td>约 2.197<\/td><\/tr><\/tbody><\/table><\/div><p>可见它没有删掉负数，也不是把负数强行取绝对值。本例正的大值被压缩，但负值的绝对值会扩大，因此不能说所有分支都“压缩所有极端值”。<\/p><p class=\"exam-note\">真实使用时 λ 通常从训练数据学习；固定 λ = 0 仅用于演示。λ = 1 时整体是恒等变换 y = x，说明“用了 Yeo-Johnson”不保证一定改变分布。<\/p><details class=\"code-setup\"><summary>想看完整公式？展开了解四个分支<\/summary><pre><code>x ≥ 0，λ ≠ 0：y = ((x + 1)^λ − 1) / λ\nx ≥ 0，λ = 0：y = ln(x + 1)\nx &lt; 0，λ ≠ 2：y = −((1 − x)^(2 − λ) − 1) / (2 − λ)\nx &lt; 0，λ = 2：y = −ln(1 − x)<\/code><\/pre><\/details><section class=\"worked-step\"><h4>把方法放回实际数据<\/h4><p>利润为 [−100, 0, 20, 300]，包含亏损、零利润和盈利。若需要幂变换，Yeo-Johnson 能直接覆盖这些取值；Box-Cox 不能直接用。转换后仍需检查分布与模型表现。<\/p><p>某些工具还会在幂变换后自动标准化。因此程序显示的最终结果可能与这里“纯变换”的数值不同，要分清幂变换和后续 scaling。<\/p><\/section><section class=\"worked-step practice\"><h4>手写练习<\/h4><p>固定 λ = 0，x = −3 时选哪个分支、结果是多少？数据含零或负数时，应优先考虑 Box-Cox 还是 Yeo-Johnson？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>负数分支：−((1+3)²−1)/2 = −15/2 = −7.5。含零或负数可考虑 Yeo-Johnson，Box-Cox 不可直接使用。<\/p><\/details><\/section>"}]}, {"title": "4. 进阶特征工程", "items": [{"title": "Derived Features：由已有字段构造特征", "explanation": "用领域知识把已有信息变成更贴近问题的变量，例如年龄、单位面积价格或时间特征。新特征必须在实际预测时可获得。", "example": "由出生日期和预测时点算年龄；Price / Area 得到单价。但预测 Price 时，将包含真实 Price 的单价作为输入会泄漏目标。", "exam": "“新特征更有信息”不等于可以使用未来或目标答案。先问预测当时是否真的知道这些字段。", "done": false}, {"title": "TF-IDF 与 Word2Vec", "explanation": "TF-IDF 衡量词在某篇文档中频繁、在整个语料中相对少见的程度；Word2Vec 学习稠密词向量，用向量关系表示词的上下文关联。", "example": "所有评价都出现的“产品”区分性可能较低；仅少数评价出现的“漏水”可能更有区分力。Word2Vec 可使上下文相近的词向量接近。", "exam": "TF-IDF 不是直接理解词义；Word2Vec 也不是每个词一个 one-hot 指示列。词表与统计量要限制在可用训练数据内。", "done": false}, {"title": "PCA：保留方差的降维", "explanation": "PCA 将多个特征线性组合成互相正交的主成分，按解释方差排序，选取较少成分降低维度。它不直接利用分类目标寻找最有预测力的方向。", "example": "身高、体重等相关特征可组合成少量主成分；不同尺度可能影响结果，因此常先考虑标准化。", "exam": "PCA 通常是特征提取，不是挑出原来的几列；保留高方差不保证保留所有重要预测信息。", "done": false}]}, {"title": "5. 偏差、公平与泛化", "items": [{"title": "Historical / Sampling Bias", "explanation": "Historical bias 是数据反映历史不平等；sampling bias 是采样缺乏代表性，某些群体不足。真实历史数据也可能包含不公平规律。", "example": "历史招聘更偏向男性，模型可能延续这一模式；人脸数据主要来自浅肤色群体，则其他群体表现可能较差。", "exam": "数据“真实”不等于公平；抽样偏差与历史偏差来源不同，可以同时存在。", "done": false}, {"title": "Label / Measurement Bias", "explanation": "Label bias 来自目标标签本身的偏差或判断错误；measurement bias 来自不同群体的测量方式、准确性或代理指标差异。", "example": "不同评审给同样能力的人不同评分是标签问题；某种医疗设备对不同群体测量精度不同是测量问题。", "exam": "多收集数据不一定修复错误标签或系统性测量差异；要识别问题发生在哪个环节。", "done": false}, {"title": "偏差如何损害泛化？", "explanation": "模型可能只擅长占多数的群体，依赖背景等捷径，或者无法适应训练中未出现的环境。整体准确率高也可能掩盖群体差异。", "example": "狼的训练照片常有雪，模型可能学“有雪就是狼”；晴天道路训练的模型在雨天或夜间可能失效。", "exam": "要检查跨群体与新场景表现。泛化问题与公平问题相关，但不是同一个概念。", "done": false}, {"title": "缓解时机：Pre / In / Post-processing", "explanation": "Pre-processing 在训练前改变数据或权重；in-processing 在模型训练中加入公平相关约束或目标；post-processing 调整训练完成后的输出或决策。", "example": "重采样属于 pre-processing；在损失中加入公平约束属于 in-processing；调整决策规则属于 post-processing。", "exam": "按干预发生的时机判断。第一周的 Process 流程阶段与这里的三种缓解时机不能机械等同。", "done": false}, {"title": "Reweighting 与 Resampling", "explanation": "Reweighting 改变样本在训练目标中的权重；resampling 改变样本被选取或重复出现的数量。二者可增加少数群体的影响，但做法不同。", "example": "少数群体样本赋更高权重，不一定增加记录；重复抽取它们，则会改变训练样本分布。", "exam": "加权或重采样不保证消除 proxy bias，也可能过拟合。并非所有模型都直接支持 sample_weight。", "done": false}, {"title": "Oversampling 与公平的区别", "explanation": "Oversampling 增加少数类或某群体的样本，可简单复制或生成新样本。要先明确平衡的是目标类别还是人口群体，并评估实际影响。", "example": "贷款违约只有 5%，增加违约训练样本是在平衡标签；增加某性别样本是在改变群体代表性，二者并不相同。", "exam": "样本数量平衡不保证 demographic parity，也不保证错误率公平。测试集通常保留真实分布以评估实际表现。", "done": false}, {"title": "SMOTE：在少数类邻居之间插值", "explanation": "SMOTE 选择少数类样本及其少数类邻居，在连接它们的线段上生成新点。基本形式 x_new = x_i + λ(x_neighbor − x_i)，0 ≤ λ ≤ 1。", "example": "少数类数值点为 2 和 6，λ = 0.25，生成点为 2 + 0.25×(6−2) = 3。二维点 (2,4) 和 (6,8)，同样生成 (3,5)。", "exam": "不是简单复制。原始 SMOTE 不适合直接插值纯类别编号；边界附近可能产生重叠或噪声，只在训练数据或训练折内采样。", "done": false}, {"title": "ADASYN 与 SMOTE-ENN", "explanation": "ADASYN 为难学、邻域中多数类较多的少数类点生成更多样本；SMOTE-ENN 先生成样本，再通过 Edited Nearest Neighbors 清理部分噪声或重叠点。", "example": "ADASYN 把更多采样资源放在困难区域；SMOTE-ENN 不只是增加样本，还可能删除两类中的原始记录。", "exam": "没有方法保证更高准确率。ADASYN 对噪声敏感；SMOTE-ENN 增加复杂性并可能删除有用样本。", "done": false}, {"title": "如何检查缓解是否有效？", "explanation": "在未参与训练和采样的数据上，比较整体指标与群体指标，例如 FPR、FNR 和正向决策比例。明确选择的公平目标，并检查准确性等代价。", "example": "FPR = FP/(FP+TN)，FNR = FN/(FN+TP)。若两个群体总体 accuracy 相似，却有很不同的 FNR，仍需要调查。", "exam": "Demographic parity 关注不同群体的正向决策率，不等于错误率相同。移除敏感字段也不能保证公平，因为其他字段可能是代理。", "done": false}]}, {"title": "6. 第二周验收", "items": [{"title": "编码选择题与 Target Encoding 计算", "explanation": "合上解释，分别为有序尺寸、少量颜色、大量供应商选择编码并说明理由，算一次类别目标均值和平滑均值。", "example": "类别目标 100、200，均值 150；n = 2，总体均值 90，m = 3，则平滑均值 = (300+270)/5 = 114。", "exam": "至少解释 one-hot 维度、frequency 同频合并、hash 碰撞和 target 泄漏四种风险。", "done": false}, {"title": "四种 Scaler 与幂变换判断", "explanation": "用自己的话写出 Standard、MinMax、Robust、MaxAbs 的统计量，再判断需要改变尺度还是改变分布形状。", "example": "含零负数且明显偏态 → 若用幂变换，考虑 Yeo-Johnson；极端值多且只需缩放 → 考虑 RobustScaler。", "exam": "能解释测试数据为什么可能超出训练缩放范围，以及 StandardScaler 为什么不能使分布自动正态。", "done": false}, {"title": "偏差辨析与采样防泄漏", "explanation": "为四类偏差各举一例，区分 reweighting、复制 oversampling、SMOTE 和 ADASYN，并画出正确训练与验证流程。", "example": "split → 在训练折拟合预处理并采样 → 训练模型 → 对未采样验证折评估。不能对全部数据 SMOTE 后再划分。", "exam": "既能说明样本平衡不等于公平，也能说明为什么验证／测试不参与合成采样。", "done": false}]}]}, "week3": {"label": "第三周", "subtitle": "Data Analytics", "storageKey": "aai-ca6003-week3-checklist-v1", "groups": [{"title": "1. 数据分析的目标与四种类型", "items": [{"title": "Data Analytics：先问问题，再选分析", "explanation": "数据分析使用统计、数学和计算方法解释模式与趋势，形成支持决策的证据。课件强调先明确问题，再选方法；同时检查数据质量、方法假设与结论限制。", "example": "同一张房价表，既能总结各区均价，也能分析价格差异、预测新房价格、推荐预算内方案。目标不同，分析类型也不同。", "exam": "不是拿到表就直接选算法。Garbage in, garbage out：再复杂的方法也不能自动修复错误或缺失的源数据。", "done": false}, {"title": "Descriptive Analytics：发生了什么？", "explanation": "描述性分析总结已经观察到的数据，常用统计汇总、分组聚合和可视化。关注数量、分布、趋势等事实，不自动给出原因或行动建议。", "example": "计算每区房价中位数、画过去一年销售额走势、统计各房型数量。输出是历史模式与趋势。", "exam": "What happened / What is happening 对应 descriptive。给出均价不能解释为什么价格高，也不是预测下一套房的价格。", "done": false}, {"title": "Diagnostic Analytics：为什么发生？", "explanation": "诊断性分析寻找观测结果的可能解释，通过关系分析、根因分析和假设检验检查证据。它可以发现关联与支持解释，但不能仅凭相关就证明因果。", "example": "研究某区房价更高是否与面积、质量、交通有关；调查最近三天销售额偏低是否来自漏导数据。", "exam": "Why did it happen 对应 diagnostic。问题问原因时，单纯给出销售总额或预测值还不够。", "done": false}, {"title": "Predictive Analytics：未知结果可能是什么？", "explanation": "预测性分析根据已知特征估计尚未知道的结果。它可以预测未来，也可以估计当前尚未知的结果；连续目标常用回归，类别目标常用分类。", "example": "根据面积、房龄和质量估计一套房的售价；根据客户特征预测是否购买。输出是预测结果，不是行动本身。", "exam": "What will happen / What is the likely outcome 对应 predictive。“未知”不一定只指未来；聚类本身通常是无监督分组，是否服务预测要看任务。", "done": false}, {"title": "Prescriptive Analytics：应该做什么？", "explanation": "决策／处方性分析在目标、预算和其他约束下推荐行动，可借助规则、优化与决策模型。通常把预测结果和成本、约束组合起来。", "example": "预算只有 10 万元，比较装修方案，推荐哪项能带来更好的预期净收益。不是只预测装修后的售价。", "exam": "What should we do 对应 prescriptive。预测售价高不等于该买：还要考虑买入价、装修费用和风险。", "done": false}, {"title": "四类分析综合辨析：按问题与输出判断", "explanation": "同一种方法可以支持不同目的，不能只看到 regression、decision tree 或 time series 就固定归类。先找题目最终要回答什么、交付什么。", "example": "回归系数用于探索面积与价格关联，可服务 diagnostic；回归预测一套新房价格则服务 predictive。时间序列汇总趋势与预测未来也不同。", "exam": "四种类型不是必须依次全部执行的固定流程。方法名称只是线索，问题与输出才是主要依据。", "done": false, "detailsHTML": "<div class=\"worked-intro\"><h3>同一家网店，四个不同问题<\/h3><\/div><div class=\"table-scroll\"><table><thead><tr><th>问题<\/th><th>英文类型<\/th><th>需要的输出<\/th><\/tr><\/thead><tbody><tr><td>上个月各类商品卖了多少？<\/td><td>Descriptive<\/td><td>汇总表、分布、趋势<\/td><\/tr><tr><td>为什么某类商品下降？<\/td><td>Diagnostic<\/td><td>可能解释及支持证据<\/td><\/tr><tr><td>下个月预计卖多少？<\/td><td>Predictive<\/td><td>未知销量的估计<\/td><\/tr><tr><td>预算有限，该给哪类商品增加推广？<\/td><td>Prescriptive<\/td><td>在成本与约束下推荐行动<\/td><\/tr><\/tbody><\/table><\/div><section class=\"worked-step practice\"><h4>手写辨析<\/h4><p>A. 估计一套尚未售出的房屋价格。<br>B. 推荐购买哪套房。<br>C. 展示不同地区的历史房价中位数。<br>D. 检查房价差异是否与面积有关。<\/p><details class=\"answer\"><summary>写完再看答案<\/summary><p>A：Predictive。B：Prescriptive。C：Descriptive。D：Diagnostic。判断依据是最终问题，不是是否使用同一张表。<\/p><\/details><\/section>"}]}, {"title": "2. 描述性分析：空间与时间", "items": [{"title": "Geospatial Visualization：哪里发生？", "explanation": "空间可视化把数据与地理位置关联，检查不同地区的模式。GeoPandas 用于空间数据处理，Folium 常用于交互地图。地图展示模式，不自动解释原因。", "example": "把各区销量显示在地图上，观察集中区域；判断时还要考虑人口规模，销量高不等于人均购买率高。", "exam": "地图适合回答 where。分母和聚合方式会影响比较，不能把总量与比率混为一谈。", "done": false}, {"title": "Time Series Analysis：怎样随时间变化？", "explanation": "时间序列分析关注趋势、季节性、波动和异常。课件举出 Statsmodels 的建模与分解，以及 SciPy 的过滤和信号处理用途。", "example": "销售额逐月上升是趋势；每年某节日销量增加是季节性；某一天突然下降可能需要检查数据完整性。", "exam": "总结已发生的走势可属于 descriptive，预测未来走势可属于 predictive；图上的异常不自动说明真实业务异常。", "done": false}]}, {"title": "3. 变量关系与模型解释", "items": [{"title": "Pearson Correlation：线性相关", "explanation": "Pearson 的 r 在 −1 到 +1 之间，衡量两个数值变量的线性关联。符号看方向，绝对值看强度；它可能受到异常值影响。", "example": "Age 与 Product_Views 的 r = −0.90：年龄较大时浏览量总体倾向较少，而且负线性关联很强。", "exam": "r = 0 不证明没有任何关系，可能有曲线关系；r = −0.90 不是浏览量每年下降 90%，也不是因果证据。", "done": false}, {"title": "Spearman Correlation：排名与单调关系", "explanation": "Spearman 基于排名，检查一个变量增大时另一个是否总体持续增大或减小。单调关系不必是一条直线，适合有序等级或数值的排名关系。", "example": "x = 1、2、3、4，y = 1、4、9、16：y 随 x 一直增大，排名完全一致，Spearman 为 1，但不是直线关系。", "exam": "单调不等于任意非线性。U 形关系先降后升，不一定被 Spearman 很好地反映。它也不能证明因果。", "done": false}, {"title": "Linear Regression：系数和预测值", "explanation": "线性回归用一个或多个特征估计连续目标。单特征形式 y_hat = b0 + b1×x；b0 是截距，b1 是斜率，y_hat 是模型预测值，不是真实观测 y。", "example": "房价模型以万元为单位：y_hat = 20 + 2×面积。面积 80 平方米，预测 180 万元；面积增加 1 平方米，模型预测增加 2 万元。", "exam": "多元回归解释系数时通常说“其他输入保持不变”。系数不是相关系数，斜率有单位；也不自动表示因果作用。", "done": false, "detailsHTML": "<section class=\"worked-step\"><h4>公式参数逐个看<\/h4><pre><code>y_hat = b0 + b1 × x\n例子：预测房价（万元） = 20 + 2 × 面积（平方米）<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>符号<\/th><th>意义<\/th><th>本例<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>输入特征<\/td><td>面积 80<\/td><\/tr><tr><td>b0<\/td><td>截距，模型在 x = 0 时的预测<\/td><td>20 万元；面积 0 可能不在合理数据范围，不强行作业务解释<\/td><\/tr><tr><td>b1<\/td><td>斜率，x 增加 1 单位时预测变化多少<\/td><td>2 万元／平方米<\/td><\/tr><tr><td>y_hat<\/td><td>预测的连续目标<\/td><td>20 + 2×80 = 180 万元<\/td><\/tr><tr><td>y<\/td><td>实际观测目标<\/td><td>真实成交价例如 190 万元<\/td><\/tr><\/tbody><\/table><\/div><p>若实际 y = 190，则残差 y − y_hat = 10 万元。预测值不保证等于真实价格，模型系数也不等同于因果作用。<\/p><\/section>"}, {"title": "Polynomial Regression：用幂次描述弯曲", "explanation": "多项式回归加入 x²、x³ 等项，例如 y_hat = b0 + b1×x + b2×x²，能表示直线无法捕捉的曲率。对 x 非线性，但对待估系数仍线性。", "example": "y_hat = 10 + 2x + x²，x = 3 时结果是 25。与直线相比，x 变化时斜率会变化。", "exam": "次数越高不保证越好，可能过拟合。为预测选择次数或其他设置时要使用验证流程，不能用测试集反复调。", "done": false}, {"title": "Feature Importance：模型依赖哪些输入？", "explanation": "特征重要性描述拟合模型在预测中使用各特征的相对程度。具体定义取决于方法，相关特征可能分摊或掩盖彼此的重要性。", "example": "房价模型可能给 OverallQual 很高的重要性，说明模型较依赖质量相关信息；不能直接证明改一分质量会造成某个涨价幅度。", "exam": "Feature importance 不是因果效应，也不等于原始特征数值大小。不同模型或计算方法的分数不能随意直接比较。", "done": false}]}, {"title": "4. 根因分析 · Root Cause Identification", "items": [{"title": "根因分析五步：从现象到验证改进", "explanation": "先定义现象与范围，再列可能原因、深入调查、验证解释、修复并跟踪。根因分析不仅给出一个看似合理的故事，还要求证据与实施后检查。", "example": "看板最近三天收入偏低：先确定哪个时间段、哪些交易缺失；比较源系统与看板，再查导入时间，修复刷新并观察完整性。", "exam": "相关或猜测不能代替验证。问题可能来自业务，也可能来自采集、处理或展示链路。", "done": false}, {"title": "Fishbone / Ishikawa Diagram：系统列出可能原因", "explanation": "鱼骨图又称 Ishikawa / cause-and-effect diagram，用分类方式组织潜在原因。课件示例类别包括 Data、Process、People、Tools，避免只盯一个猜测。", "example": "收入偏低：Data 可能漏记录，Process 可能刷新过早，People 可能录入延迟，Tools 可能任务失败。", "exam": "鱼骨图负责整理候选原因，不是因果证明，也不会自动确定哪个原因是真的。分类可以按问题调整。", "done": false}, {"title": "5 Whys：沿着证据继续追问", "explanation": "针对某条可能原因反复问为什么，逐层寻找更深的机制与流程问题。名称中的 5 是方法提示，不要求任何问题都机械追问恰好五次。", "example": "为什么收入低？晚间交易没进来。为什么没进来？导入太早。为什么之后没补上？没有后续刷新。再用时间记录检验这条解释。", "exam": "不能只靠口头猜测一路推演。复杂问题可能有多个原因；找到解释后仍需核查并验证修复效果。", "done": false}]}, {"title": "5. 假设检验 · Hypothesis Testing", "items": [{"title": "H0、H1 与检验流程", "explanation": "H0（null hypothesis）是待检验的基准假设；H1（alternative hypothesis）表达替代方向或差异。先写假设、选检验并确定 α，再算统计量与 p-value、判断并解释。", "example": "课件认知游戏例子：令 Δ = 训练后评分 − 训练前评分，关注改善时可设 H0：总体平均 Δ ≤ 0，H1：总体平均 Δ > 0。", "exam": "单侧还是双侧由问题预先决定，不能看结果后选择更容易显著的方向。假设描述的是总体，而不是只复述样本。", "done": false}, {"title": "p-value 与 alpha：每个符号是什么意思？", "explanation": "p-value 在 H0 和模型假设成立时，衡量得到当前或更极端检验结果的概率。α（alpha）是事先设定的显著性水平，如 0.05；p 是由数据和检验得到的结果。", "example": "认知游戏例子 p = 0.03，α = 0.05：p 比阈值小，所以在该检验规则下拒绝 H0。p = 0.20 时则不拒绝。", "exam": "p 不是 H0 为真的概率，也不是“改善有 97% 的概率是真的”。不拒绝 H0 不等于证明 H0；应按题目指定的严格或包含边界规则判断。", "done": false, "detailsHTML": "<div class=\"worked-intro\"><h3>课件例子：认知游戏是否改善注意力？<\/h3><\/div><section class=\"worked-step\"><h4>先明确符号，再读结论<\/h4><div class=\"table-scroll\"><table><thead><tr><th>符号<\/th><th>含义<\/th><th>例子<\/th><\/tr><\/thead><tbody><tr><td>H0<\/td><td>基准／原假设<\/td><td>总体没有正向改善<\/td><\/tr><tr><td>H1<\/td><td>备择假设<\/td><td>总体有正向改善<\/td><\/tr><tr><td>α<\/td><td>事先设定的显著性阈值<\/td><td>0.05<\/td><\/tr><tr><td>p<\/td><td>在 H0 与检验假设成立时，结果至少如此极端的概率<\/td><td>计算得到 0.03<\/td><\/tr><\/tbody><\/table><\/div><pre><code>p = 0.03 &lt; α = 0.05\n→ Reject H0（拒绝原假设）\n→ 在本检验条件下，存在支持改善的统计证据。<\/code><\/pre><p>不是“改善一定发生”，也不是“原假设只有 3% 概率是真的”。还要检查改善了多少、个体差异、研究设计与检验假设。<\/p><\/section><section class=\"worked-step\"><h4>如果 p = 0.08 呢？<\/h4><pre><code>p = 0.08 &gt; α = 0.05\n→ Fail to reject H0（不拒绝原假设）\n→ 当前证据不足以按该阈值拒绝 H0。<\/code><\/pre><p>这不证明游戏没有效果：可能没有效果，也可能数据太少、波动太大，当前检验没有足够证据。避免说 accept / prove H0。<\/p><p class=\"exam-note\">α 控制相应检验在 H0 成立时长期误拒的概率水平，不是本次结论“有 5% 概率错误”。<\/p><\/section><section class=\"worked-step practice\"><h4>先自己判断<\/h4><p>1. p = 0.01、α = 0.05，是否拒绝 H0？<br>2. p = 0.30，能证明 H0 正确吗？<br>3. p 很小，是否说明改善幅度一定很大？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>1. 拒绝。2. 不能，只是不拒绝。3. 不能，显著性与效应大小不同。<\/p><\/details><\/section>"}, {"title": "Statistical Significance 与实际意义", "explanation": "统计显著表示在选定假设、检验与阈值下证据达到拒绝标准，不直接说明影响很大、很重要或由干预造成。还要看效应大小、区间、不确定性和研究设计。", "example": "非常大的样本可能让平均提高 0.1 分达到显著，但实际意义很小；小样本中较大提升也可能因不确定性大而未达到显著。", "exam": "Significant 不等于 large 或 causal。实验是否支持因果要看随机化、对照和其他设计条件。", "done": false}, {"title": "t-test：比较两个均值或条件", "explanation": "t-test 常用于两个群体或条件的均值比较。独立两组和同一对象前后测的结构不同，应选独立样本或配对检验，并检查对应假设。", "example": "同一批人玩游戏前后评分，采用配对思路；两批独立参与者分别使用不同训练方法，则采用独立样本思路。", "exam": "不能只看到“两组”就忽略配对关系。并非任何两列数据都适合 t-test，要看设计、独立性和差值等分布条件。", "done": false}, {"title": "ANOVA：比较三组及以上均值", "explanation": "ANOVA 可比较多个群体的均值，常用原假设是各总体均值相等。拒绝时说明并非所有均值都相同，不说明具体哪两组不同。", "example": "比较 A、B、C 三种训练方法的平均注意力评分。检验显著后，还需适当的后续比较才能定位差异。", "exam": "显著不代表所有组两两不同，也不直接说明哪种最好；重复进行很多 t-test 会增加多重比较问题。", "done": false}, {"title": "Chi-square Test：类别变量的关联", "explanation": "卡方独立性检验（χ² test）使用类别计数的列联表，检查两个类别变量是否独立，需关注样本独立性和期望计数条件。", "example": "房型（公寓／排屋）与区域（东／西／北）是否有关联？先统计每种组合出现多少条记录，不是比较平均房价。", "exam": "类别关联与连续数值均值比较是不同问题。显著不证明因果；小期望计数时可能需要其他处理或检验。", "done": false}, {"title": "Correlation / Regression Significance Tests", "explanation": "相关检验检查总体关联是否有统计证据，例如 Pearson 常检验总体线性相关为 0；回归系数检验检查模型中某系数是否与 0 有差异。需结合模型假设解释。", "example": "GrLivArea 与 SalePrice 的相关显著吗？OverallQual 在包含其他输入的回归模型中，系数是否有证据区别于 0？", "exam": "关联强度和显著性是两个概念。相关显著不一定很强；系数显著也不意味着该变量独立造成目标变化。", "done": false}, {"title": "Non-parametric Tests：参数假设不适合时", "explanation": "非参数方法在某些参数检验假设不适合时可考虑，课件列举 Mann–Whitney U 和 Wilcoxon。独立两组与配对结构仍须分清，它们不是完全没有假设。", "example": "独立两组可考虑 Mann–Whitney U；同一批人的前后差值可考虑 Wilcoxon signed-rank，同时核对各检验适用条件。", "exam": "不要一概说非参数检验“专门比较均值”或“任何数据都能用”。它们通常基于排名或分布，具体解释取决于条件。", "done": false}]}, {"title": "6. 房价综合案例与第三周验收", "items": [{"title": "同一房价案例，四种分析输出", "explanation": "沿用课件买房、装修转售、开发和抵押估值案例。逐步区分模式、解释、估计与行动，尤其不要把预测高价格直接当成高利润。", "example": "历史同类房价格是 descriptive；检查某房便宜的相关因素是 diagnostic；估计翻新后售价是 predictive；比较预算内装修选择是 prescriptive。", "exam": "预期利润 = 预期售价 − 买价 − 装修费 − 其他费用；预期值不是保证收益，完整决策还应考虑不确定性。", "done": false, "detailsHTML": "<section class=\"worked-step\"><h4>预期利润：一步一步代入<\/h4><pre><code>预期售价 = 120 万元\n购买价格 = 90 万元\n装修费用 = 10 万元\n其他费用 = 5 万元\n\n预期利润 = 120 − 90 − 10 − 5 = 15 万元<\/code><\/pre><p>“预测卖 120 万元”是 predictive；“比较多套房，推荐符合预算、收益和风险要求的方案”才是 prescriptive。数字是练习假设，不是实际投资建议。<\/p><\/section>"}, {"title": "第三周混合自测", "explanation": "合上笔记，用自己的话区分四类分析、两种相关、根因方法和检验选择；逐条写出选择理由，再核对解释。", "example": "写出：三组平均评分比较用什么；同一人前后用什么；房型与区域关联用什么；p = 0.08、α = 0.05 时如何表述。", "exam": "检查是否犯了三类错误：相关当因果、不拒绝当证明、预测结果当行动建议。错题写清遗漏的条件。", "done": false}]}]}, "ca6001-week1": {"label": "第一周", "subtitle": "Supervised and Unsupervised Learning", "storageKey": "aai-ca6001-week1-checklist-v1", "groups": [{"title": "1. AI、ML 与学习类型", "items": [{"title": "AI、Machine Learning、Deep Learning", "explanation": "AI 是较广的智能方法领域；ML 从数据或交互中学习；Deep Learning 是使用深层神经网络的一类 ML。Data Science 与这些领域重叠，但也包含统计、数据处理和业务理解。", "example": "用规则设计搜索可以属于 AI，不一定是 ML；从历史价格学习预测是 ML；多层神经网络学习图像表示属于 DL。", "exam": "AI、ML、DL 不是三个互斥类别；深度学习属于机器学习，机器学习属于 AI，但数据科学不只等于 AI。", "done": false}, {"title": "Supervised Learning：有目标标签", "explanation": "训练数据包含输入 X 和已知目标 y，学习从 X 到 y 的映射，再面对新输入作预测。标签是任务要预测的答案，不是随便一列类别。", "example": "输入面积、位置，标签是真实成交价；输入邮件内容，标签是 spam / not spam。", "exam": "X 可以包含数值或类别，y 也可以是连续数值或类别；有标签不意味着预测一定准确。", "done": false}, {"title": "Regression vs Classification", "explanation": "回归预测连续数值，分类预测类别或类别概率。看目标的含义判断，不能只看输出是不是数字。", "example": "预测售价是 regression；预测是否欺诈是 classification，0 和 1 表示类别；分类器输出 0.8 可以表示概率。", "exam": "Logistic regression 名称带 regression，但通常用于分类。用户 ID 是数字也不意味着预测 ID 是通常的连续回归。", "done": false}, {"title": "Unsupervised Learning：没有预先给定的目标答案", "explanation": "从没有任务目标标签的数据中发现模式，例如聚类或降维。无需事先知道每个样本正确所属的群组，不是完全不需要数据或人工选择。", "example": "按购买频率和客单价把客户分组；PCA 把多列组合成少量主成分。", "exam": "聚类不是把已知类别标签作为答案训练；不是所有无监督任务都输出类别，也不能说一定需要预测一个已知 y。", "done": false}, {"title": "标签少时怎么办？", "explanation": "大量输入只有少量标签时，可考虑半监督学习、主动选择待标注样本或利用预训练等思路。该主题在课件中是讨论题，要说明方法需要什么额外假设。", "example": "先给少量邮件人工标注，结合未标注邮件学习；主动挑模型最不确定的邮件请人标注。", "exam": "伪标签可能把错误放大；标签少不等于无监督方法一定更好，也不代表任意模型都能免标签训练。", "done": false}]}, {"title": "2. 回归模型与泛化", "items": [{"title": "Linear Regression：学习 w 和 b", "explanation": "单输入预测函数 y_hat = wx + b；x 是输入，w 是斜率或权重，b 是截距。训练通过损失评价预测误差，再寻找合适参数。", "example": "w = 2，b = 10，x = 30，则预测 70；真实值为 80，残差 y − y_hat = 10。", "exam": "模型训练学的是参数，预测时输入新 x；回归斜率不是相关系数，拟合关系不自动证明因果。", "done": false}, {"title": "Squared Error 与 Gradient Descent", "explanation": "平方误差将预测与真值之差平方并汇总，MSE 为各误差平方的平均。梯度下降沿损失下降方向迭代更新参数；是否带 1/2 系数按题目定义。", "example": "真值 [2,4]、预测 [3,2]，误差 [1,−2]，平方 [1,4]，MSE = 2.5。", "exam": "误差相互抵消会掩盖问题，平方避免正负抵消；最小训练损失不保证新数据表现最好，复杂模型也不保证全局最优。", "done": false}, {"title": "Overfitting：高 variance", "explanation": "模型过度追随训练样本和噪声，训练表现好、验证或测试表现差。要通过独立评估识别，可考虑减少复杂性、正则化或增加有代表性的数据。", "example": "训练准确率 99%，验证只有 70%；一条很复杂的曲线穿过训练点，却对新点预测很差。", "exam": "训练准确率高不等于过拟合，必须结合新数据；交叉验证帮助检测和选择方案，不会自动消除所有过拟合。", "done": false}, {"title": "Underfitting：高 bias", "explanation": "模型能力或训练设置不足，连训练中的主要规律都无法学好，训练和验证表现都较差。可检查特征、模型复杂度与优化情况。", "example": "数据明显弯曲，却用过于简单的直线，训练和验证误差都大。", "exam": "不能一概把所有低成绩都归因于欠拟合；还可能有数据错误、标签噪声或分布变化。", "done": false}, {"title": "Train / Validation / Test 与 K-fold", "explanation": "训练集学习参数，验证用于选择方案，测试用于最后评估。交叉验证在训练范围内轮流划分训练折与验证折；每轮预处理也只在该轮训练数据 fit。", "example": "100 条先留出 20 条测试，80 条分 A/B/C/D；每轮 60 训练、20 验证；选好方案再用 80 条训练最终模型。", "exam": "同一条记录在不同轮次可扮演不同角色，但同一轮不能训练和验证重叠。测试集不能反复帮助调参。", "done": false}]}, {"title": "3. 分类评价与第一周验收", "items": [{"title": "Confusion Matrix：TP、FP、FN、TN", "explanation": "先定义哪个类别是 positive。TP 为真正类预测正，FP 为真负类预测正，FN 为真正类预测负，TN 为真负类预测负。", "example": "欺诈设为 positive：抓对欺诈是 TP；误报正常交易是 FP；漏掉欺诈是 FN；放行正常交易是 TN。", "exam": "“正”不一定是好结果，它是选定的目标类别。混淆矩阵行列顺序可能不同，先看标签再读。", "done": false, "detailsHTML": "<section class=\"worked-step\"><h4>一张表串起全部指标<\/h4><p>Positive 定义为欺诈。100 条交易中，实际欺诈 20 条、正常 80 条。<\/p><div class=\"table-scroll\"><table><thead><tr><th>实际类别<\/th><th>预测欺诈<\/th><th>预测正常<\/th><\/tr><\/thead><tbody><tr><td>实际欺诈<\/td><td>TP = 8<\/td><td>FN = 12<\/td><\/tr><tr><td>实际正常<\/td><td>FP = 2<\/td><td>TN = 78<\/td><\/tr><\/tbody><\/table><\/div><pre><code>Precision = 8 / (8 + 2) = 0.8\nRecall = 8 / (8 + 12) = 0.4\nF1 = 2 × 0.8 × 0.4 / (0.8 + 0.4) ≈ 0.533\nAccuracy = (8 + 78) / 100 = 0.86<\/code><\/pre><p>预测正类一共 10 条，实际正类一共 20 条。两个不同分母正是 precision 与 recall 的区别。<\/p><\/section><section class=\"worked-step practice\"><h4>自己再算一次<\/h4><p>TP = 6、FP = 3、FN = 4、TN = 7：precision、recall、accuracy 各是多少？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>P = 6/9 ≈ 0.667；R = 6/10 = 0.6；accuracy = 13/20 = 0.65。<\/p><\/details><\/section>"}, {"title": "Precision：报出来的有多少是真的？", "explanation": "Precision = TP/(TP+FP)，分母是预测正的样本数。高 precision 表示误报比例较低，但不能保证发现了所有正类。", "example": "报告 10 笔欺诈，其中 8 笔是真的：TP = 8，FP = 2，precision = 0.8。", "exam": "分母不是实际正类数量。预测非常谨慎可能 precision 高但 recall 低；不能只凭一个指标评价。", "done": false}, {"title": "Recall：真的正类找到了多少？", "explanation": "Recall = TP/(TP+FN)，分母是实际正类数。高 recall 表示少漏检，但可能伴随更多误报。", "example": "实际有 20 笔欺诈，抓到 8 笔：TP = 8，FN = 12，recall = 0.4。", "exam": "分母不是模型报告的正类数量。降低分类阈值通常增加 recall，但代价取决于评分分布。", "done": false}, {"title": "F1 与不平衡数据", "explanation": "F1 = 2PR/(P+R)，是 precision 和 recall 的调和平均。Accuracy = (TP+TN)/总数，类别不平衡时可能误导；F1 本身也不包含 TN。", "example": "99 笔正常、1 笔欺诈，全部预测正常有 99% accuracy，但欺诈 recall 为 0。", "exam": "F1 不是简单 (P+R)/2；指标选择要匹配误报与漏报成本，不存在任何情况下都最佳的单一指标。", "done": false}, {"title": "ROC-AUC：跨阈值的排序能力", "explanation": "ROC 比较不同阈值的 TPR（recall）与 FPR = FP/(FP+TN)。AUC 衡量正样本评分高于负样本的排序能力，接近 1 常表示排序好。", "example": "AUC = 0.5 常对应无有效排序能力；即使 AUC 高，也要选适合具体成本的阈值，并检查实际 precision/recall。", "exam": "AUC 不等于 accuracy，也不说明概率校准好；极不平衡数据还应关注正类相关指标。", "done": false}, {"title": "第一周混合自测", "explanation": "分别解释监督与无监督、回归与分类、过拟合与欠拟合；再用一组混淆矩阵计算指标。", "example": "TP = 8、FP = 2、FN = 12、TN = 78：P = 0.8，R = 0.4，F1 ≈ 0.533，accuracy = 0.86。", "exam": "要解释每个分母的对象，不只背公式；说明为何好训练成绩不等于好泛化。", "done": false}]}]}, "ca6001-week2": {"label": "第二周", "subtitle": "Reinforcement Learning", "storageKey": "aai-ca6001-week2-checklist-v1", "groups": [{"title": "1. 强化学习的交互与目标", "items": [{"title": "Reinforcement Learning：累计回报", "explanation": "Agent 与 environment 交互，根据奖励学习策略，目标通常是提高预期累计回报。不同于每条记录都有正确动作标签的监督学习。", "example": "机器人试着移动，环境反馈位置变化和奖励；短期绕路可能换来长期更高收益。", "exam": "不要求预先给每步正确动作标签，但仍需输入、环境与反馈。奖励可延迟，不能只最大化下一步奖励。", "done": false}, {"title": "Agent、Environment、State、Action、Reward", "explanation": "Agent 是做决定的主体；environment 是交互系统；state 表示当前状况；action 是可选操作；reward 是对行动后结果的反馈。", "example": "CartPole：控制器是 agent，仿真是 environment，杆角度和速度等是状态，左右推车是动作，保持杆直立获得奖励。", "exam": "观测不一定等于完整状态；奖励不是目标标签，“环境”也不一定是真实物理世界，可以是仿真。", "done": false}, {"title": "Policy π：在状态下如何选动作", "explanation": "策略规定给定状态时如何行动，可以确定性地选动作，也可以输出动作概率。策略与价值函数含义不同。", "example": "在路口状态下选左转是确定策略；以 70% 概率左转、30% 右转是随机策略。", "exam": "Policy-based 不等于一定 deterministic；策略描述动作选择，Q 值描述该动作的预期回报。", "done": false}, {"title": "奖励设计与交互流程", "explanation": "定义环境、观测与动作，设计奖励，再交互收集反馈、更新策略和评估。奖励应与实际目标一致，否则 agent 可能找到不希望出现的捷径。", "example": "配送只奖励单次接单量，可能忽视长期等待或公平；要结合时效、服务质量和约束设计。", "exam": "奖励高不保证真实业务目标实现，也不意味着安全或公平。案例需要说明状态、动作、奖励，而不只写“用 RL”。", "done": false}]}, {"title": "2. 价值、探索与算法区别", "items": [{"title": "V(s) 与 Q(s,a)", "explanation": "V 表示从某状态出发按某策略行动的预期回报；Q 表示在该状态先采取某动作、之后按策略行动的预期回报。二者不是即时奖励。", "example": "同一格子 V 是整体前景；Q(格子,向左) 与 Q(格子,向右) 比较不同第一步的前景。", "exam": "Q 是 state-action value；高即时 reward 不一定对应高 Q。数值依赖策略、转移与奖励设置。", "done": false}, {"title": "Discount Factor γ：未来奖励打几折", "explanation": "γ（gamma）控制未来奖励权重；回报可写成 r0 + γr1 + γ²r2 + …。γ 大通常更重视远期，γ = 0 则只看即时奖励。", "example": "即时奖励 2、下一步奖励 10、γ = 0.9，回报为 2 + 0.9×10 = 11；γ = 0.1 时为 3。", "exam": "γ 不是学习率，也不是探索概率；无限持续任务通常需要 γ < 1 等收敛条件，具体范围按任务设定。", "done": false}, {"title": "概率加权的状态价值计算", "explanation": "有多个动作或转移结果时，将每种可能的 r + γV(next) 乘其概率后相加。按题目指定策略与奖励理解，不擅自选最大替代平均。", "example": "两种结果概率均 0.5，即时奖励 −1，后续 V 分别 0、10，γ = 0.9：0.5×(−1)+0.5×8 = 3.5。", "exam": "概率必须对应题目，并加总为 1。取期望和选最优动作是不同操作；终止状态后续价值通常按题目设为 0。", "done": false}, {"title": "Exploration vs Exploitation", "explanation": "探索尝试不确定动作获取信息；利用选择当前估计较好的动作获取回报。需要权衡，不能一开始永久只选当前最好。", "example": "餐厅 A 已知不错，B 尚未尝试：吃 A 是利用，试 B 是探索。B 可能更好，也可能更差。", "exam": "探索不是永远随机；利用依赖当前估计，不保证当前最好就是实际最优。", "done": false}, {"title": "ε-greedy 与 Multi-Armed Bandit", "explanation": "ε-greedy 常以 ε 概率探索，其余利用当前估计最优动作。Bandit 关注反复选择未知回报的臂，基础设定不建模动作导致的多步状态转移。", "example": "ε = 0.1 时约 10% 机会执行探索分支；三种推荐方案的点击率未知，需要边尝试边更新均值。", "exam": "ε 不是 γ。若探索分支也可能随机选中最好动作，“探索分支比例”不等于非最优动作的精确比例。", "done": false}, {"title": "Value-based、Policy-based、Model-based", "explanation": "Value-based 学习价值以辅助选动作；policy-based 直接学习策略；model-based 学习或利用环境转移与奖励模型进行规划。分类维度有交叉，非三个绝对互斥盒子。", "example": "Q-table 是价值方法；直接输出动作概率是策略方法；预测执行动作后的状态再规划是模型方法。", "exam": "Model-free 不等于不用神经网络，指不依赖显式环境模型；policy 可以随机，不必固定选一个动作。", "done": false}, {"title": "Q-learning vs SARSA", "explanation": "Q-learning 常用下一状态最大 Q 作为更新目标，经典形式是 off-policy；SARSA 用实际选择的下一动作 Q，经典形式是 on-policy。", "example": "下一状态某最优动作值为 10，但探索实际选到值为 2 的动作：Q-learning 目标用 10，SARSA 用 2。", "exam": "二者都可以探索，区别不是一个随机、一个不随机；是学习目标是否基于实际行为策略选择的下一动作。", "done": false, "detailsHTML": "<section class=\"worked-step\"><h4>两个算法，更新目标不同<\/h4><pre><code>Q-learning：\nQ_new(s,a) = Q_old(s,a) + α × [r + γ max_a' Q(s',a') − Q_old(s,a)]\n\nSARSA：\nQ_new(s,a) = Q_old(s,a) + α × [r + γ Q(s',a') − Q_old(s,a)]<\/code><\/pre><div class=\"table-scroll\"><table><thead><tr><th>符号<\/th><th>含义<\/th><\/tr><\/thead><tbody><tr><td>s、a<\/td><td>当前状态与执行的动作<\/td><\/tr><tr><td>s'、a'<\/td><td>下一状态；SARSA 中 a' 是下一实际选择的动作<\/td><\/tr><tr><td>r<\/td><td>这次转移的即时奖励<\/td><\/tr><tr><td>α<\/td><td>学习率，控制旧估计向目标移动多远<\/td><\/tr><tr><td>γ<\/td><td>折扣因子，控制未来价值的权重<\/td><\/tr><\/tbody><\/table><\/div><p>旧 Q = 4、α = 0.5、r = 1、γ = 0.9；下一状态最大 Q = 10，但实际探索动作 Q = 2。<\/p><pre><code>Q-learning 目标 = 1 + 0.9×10 = 10\n更新值 = 4 + 0.5×(10 − 4) = 7\n\nSARSA 目标 = 1 + 0.9×2 = 2.8\n更新值 = 4 + 0.5×(2.8 − 4) = 3.4<\/code><\/pre><p>区别是 max 与实际选中动作。不是把未来奖励完全忽略，也不是“所有 off-policy 都随机”。<\/p><\/section>"}, {"title": "Deep Q-learning / DQN", "explanation": "用神经网络近似动作价值函数，而不是为每个状态动作组合保存一项表格。典型离散动作任务中输入观测，输出各动作的 Q 估计。", "example": "Atari 画面作为输入，网络估计左、右等动作的回报，选择动作并利用交互训练。", "exam": "DQN 输出通常是 Q 值，不必是动作概率；神经网络不等于显式模拟环境，所以可仍是 model-free。", "done": false}]}, {"title": "3. RLHF、限制与第二周验收", "items": [{"title": "RLHF：人类反馈提供学习信号", "explanation": "经典 RLHF 路线利用人工示例或偏好，训练奖励模型，再据此优化模型策略。反馈帮助塑造奖励，但不保证所有输出正确或价值一致。", "example": "人类对同一提示的两个回答排序，奖励模型学习偏好，后续优化使模型更倾向被偏好的回答。", "exam": "不是每次回答都由人实时评分；奖励模型也不是知识库。SFT、奖励学习与策略优化是不同环节。", "done": false}, {"title": "RLHF 流程与 GRPO 认识", "explanation": "课件介绍数据收集、监督微调、人类评分奖励模型和策略优化，并提到 GRPO。GRPO 可用同提示多份回答的组内奖励比较形成相对学习信号。", "example": "同一个题目生成多种解答，将奖励与组内表现比较；奖励来源仍须按具体实现确定。", "exam": "不是所有 RLHF 或 RL 后训练方案都有独立奖励模型，不能把经典流程说成唯一实现；RAG 不等于监督微调。", "done": false}, {"title": "RL 的挑战", "explanation": "交互样本成本、计算成本、探索风险和奖励设计都可能限制 RL。模型在仿真中表现好也不保证能直接在真实环境安全使用。", "example": "自动驾驶的失败探索代价高；配送策略必须考虑实际约束；奖励被钻空子时分数高也可能行为差。", "exam": "RL 不是任何预测任务的默认方案，必须说明为什么需要序贯决策与反馈。", "done": false}, {"title": "第二周混合自测", "explanation": "给一个 CartPole 或配送场景写出 agent/state/action/reward；比较策略与价值、Q-learning 与 SARSA，再计算一项折扣回报。", "example": "r0 = 1、r1 = 2、r2 = 10、γ = 0.5：回报为 1+1+2.5 = 4.5。", "exam": "能解释 why：为什么需要探索、为什么 model-free 可以用网络、为什么奖励不是标签。", "done": false}]}]}, "ca6001-week3": {"label": "第三周", "subtitle": "Deep Learning", "storageKey": "aai-ca6001-week3-checklist-v1", "groups": [{"title": "1. 深度学习与神经元", "items": [{"title": "Deep Learning 与层次表示", "explanation": "多层神经网络逐步组合输入，学习不同抽象层次的表示。通常减少某些手工特征设计需求，但仍依赖任务、数据与合适处理。", "example": "图像中先学习局部边缘，再组合纹理和形状，最后用于物体识别。", "exam": "不是所有层都会自动对应可解释的人类概念，也不保证深度越大效果越好。", "done": false}, {"title": "为什么深度学习重新兴起？", "explanation": "数据规模、计算资源和算法进步共同支持更大模型的训练。模型能力与可用数据、算力和训练方式相互关联。", "example": "GPU 并行计算支持大量矩阵运算，大型数据集为多参数模型提供更多训练信息。", "exam": "不能只归因于“模仿大脑”；更多数据或算力也不保证数据质量、泛化和公平。", "done": false}, {"title": "Neuron：输入、权重、偏置、激活", "explanation": "神经元先算 z = Σw_i x_i + b，再算 a = g(z)。x 是输入，w 是学到的权重，b 是偏置，g 是激活函数，a 是输出。", "example": "x1 = 2、x2 = 3，w1 = 0.5、w2 = −1，b = 1：z = 1−3+1 = −1，ReLU 输出 0。", "exam": "加权和 z 不一定等于最终输出 a；神经网络中的 z 符号不一定指前面异常检测的 Z-score。", "done": false, "detailsHTML": "<section class=\"worked-step\"><h4>从输入一步一步得到神经元输出<\/h4><pre><code>z = w1×x1 + w2×x2 + b\na = ReLU(z) = max(0,z)\n\nx1 = 2，x2 = 3：原始输入\nw1 = 0.5，w2 = −1：权重\nb = 1：偏置\n\nz = 0.5×2 + (−1)×3 + 1\n  = 1 − 3 + 1 = −1\na = max(0,−1) = 0<\/code><\/pre><p>权重决定各输入如何贡献；偏置调整整体位置；激活对加权和进行非线性处理。<\/p><\/section><section class=\"worked-step practice\"><h4>手写自测<\/h4><p>x1 = 4、x2 = 1，其他参数不变，z 与 a 是多少？<\/p><details class=\"answer\"><summary>展开答案<\/summary><p>z = 0.5×4 − 1×1 + 1 = 2；ReLU 输出 a = 2。<\/p><\/details><\/section>"}, {"title": "层与 Dense / Fully Connected", "explanation": "输入层提供特征，隐藏层变换表示，输出层产生任务结果。Dense 表示当前层神经元与上一层输入连接，参数量与输入输出维数有关。", "example": "3 个输入连接 2 个输出神经元，有 3×2 = 6 个权重，若每个输出有一个 bias，再加 2，共 8 个参数。", "exam": "层数统计常不把输入层算入可训练层；以课件或题目约定为准。Dense 并不意味着激活必须线性。", "done": false}]}, {"title": "2. Forward、Backward 与优化", "items": [{"title": "Forward Propagation：算预测", "explanation": "输入逐层经过加权和与激活，最后得到预测；训练时也进行 forward，才能计算损失。推理一般使用已学好的参数进行 forward。", "example": "给图片输入固定网络，逐层计算得到猫的概率；训练时将该概率与真标签比较计算 loss。", "exam": "Forward 不是仅在测试使用，也不是每次预测都更新权重；参数更新属于训练流程。", "done": false}, {"title": "Loss：预测错多少？", "explanation": "损失把预测与目标的差异转成训练信号。回归可用平方误差，分类可用交叉熵等，具体选择随任务而变。", "example": "真值 4、预测 2，平方误差为 4；训练对多个样本汇总损失，再计算梯度。", "exam": "Loss 和 accuracy 不是一回事；训练 loss 降低不能独立证明验证表现改善。", "done": false}, {"title": "Backpropagation：求各参数梯度", "explanation": "反向传播通过链式法则，从损失向前面各层计算参数梯度，说明参数微小变化如何影响损失。通常优化器随后利用梯度更新参数。", "example": "求出 ∂L/∂w = 2，说明在当前点 w 增大一点会倾向使损失增加，更新可往相反方向。", "exam": "Backprop 计算梯度，不等于优化器本身；普通预测不需要为了作答而进行反向更新。", "done": false}, {"title": "Gradient Descent：更新参数", "explanation": "w_new = w_old − α×∂L/∂w，α 是学习率。减去梯度让参数向局部下降方向移动，更新幅度还取决于梯度大小。", "example": "w = 3，梯度 = 2，α = 0.1，则 w_new = 2.8；若梯度 = −2，则 w_new = 3.2。", "exam": "不是每次都把参数减小；梯度为负时参数会增大。不能把学习率 α 与 RL 折扣 γ 混淆。", "done": false}, {"title": "Learning Rate：步子有多大？", "explanation": "学习率太大可能震荡或发散，太小可能收敛慢；需要观察训练和验证并选择合适设置，优化器也可能自适应或配合调度。", "example": "沿坡下降，大步可能越过低点，小步可能走得很慢。", "exam": "更大学习率不等于更快得到好模型，更多 epoch 也不能自动解决过大的步长。", "done": false}]}, {"title": "3. 激活与常见网络架构", "items": [{"title": "为什么需要非线性激活？", "explanation": "多个纯线性或仿射层组合仍可表示成一个仿射变换。非线性激活让网络能够表达更复杂的输入输出关系。", "example": "只叠加 wx+b 不能靠层数自动得到任意曲线；加 ReLU 或其他非线性后可形成复杂分段变化。", "exam": "层多不等于一定非线性；激活选择取决于层位置与任务，不能说每层必用同一种。", "done": false}, {"title": "ReLU、Sigmoid、Tanh", "explanation": "ReLU(z)=max(0,z)；sigmoid(z)=1/(1+e^(−z))，范围 0～1；tanh 范围 −1～1。不同激活有不同数值特性与梯度问题。", "example": "z = −2：ReLU 为 0；z = 0：sigmoid 为 0.5、tanh 为 0；z = 3：ReLU 为 3。", "exam": "Sigmoid 数值范围像概率，但概率解释与任务训练有关；ReLU 没有最大值 1，长期负输入也可能造成神经元不激活。", "done": false}, {"title": "CNN：局部模式与共享权重", "explanation": "卷积网络用滤波器在不同位置处理局部区域，共享权重，适合利用图像空间结构。不同层可以组合更复杂的模式。", "example": "同一个边缘滤波器扫过图片各位置，而非为每个像素位置单独学习完全独立的规则。", "exam": "CNN 不只限于图像；不是直接把所有像素都看成无关列，也不保证对任意位置变化完全不敏感。", "done": false}, {"title": "Transformer / Attention：根据上下文加权", "explanation": "Attention 按输入间关联对信息加权。Q 是查询，K 用于匹配，V 提供被汇总的信息；Transformer 用这些机制构建表示。", "example": "“The fox jumped. It was agile.” 中 It 的表示可关注 fox 的信息，从上下文帮助理解指代。", "exam": "并非所有 Transformer 都是双向；自回归生成通常使用因果遮罩。Attention 不等于神奇理解，也不保证指代永远正确。", "done": false}, {"title": "应用、限制与第三周验收", "explanation": "课件包含视觉、NLP 等应用，以及数据需求、计算成本、解释性、偏差和隐私限制。能算神经元、分清 forward/backprop/optimizer，再解释架构用途。", "example": "先算加权和和 ReLU；再用一个梯度更新例子；指出 CNN 适合局部空间模式，attention 用于上下文交互。", "exam": "构建或训练成功不保证真实效果。不要只背术语：说清数据、任务、输出与评估。", "done": false}]}]}};

const lastWeek={ca6003:'week1',ca6001:'ca6001-week1'};
const courseButtons=[...document.querySelectorAll('[data-course]')];
